# references/sources/<id>.yaml — one file per source. Schema: schemas/source.schema.json
# IDs are stable slugs: <org-or-first-author>-<short-title>-<year>. Never rename or reuse.

id: org-short-title-2026
title: Full title as published
authors: []                       # people, "Last FM" form; or leave empty and use organization
organization: null                # issuing body for guidelines, statements, labels, databases
year: 2026
publication: null                 # journal, publisher or website
type: guideline                   # guideline | systematic-review | meta-analysis | scientific-statement | umbrella-review | rct | cohort | mendelian-randomization | mechanistic | regulatory | drug-label | database | expert-explainer | manufacturer
tier: "1"                         # "1"-"6" | "R" | "M"  (METHODS §2)
jurisdiction: international       # us-federal | us-professional | canada | uk | eu | australia-nz | who | international | other
authority: null                   # ID from references/authorities.yaml, if issued by one
domains: []                       # blood-pressure | glycemia | lipids | weight | kidney | liver | general-nutrition | food-safety | medicines
edition: null                     # as the publisher lists it, e.g. "2025 edition" or a drug label's "SUPPL-104 (2023-08)"
edition_check:                    # required for guidelines and drug labels (METHODS §5)
  date: YYYY-MM-DD
  searched: Where you looked for a newer edition (authority site, Drugs@FDA, DailyMed, PubMed)
  result: current                 # current | newer-recorded | newer-not-recorded | not-determined (couldn't establish the latest; say why in notes)
  newer: null                     # source ID or citation of the newer edition, if any
  evidence_url: null              # the page that lists the latest edition (drug labels: Drugs@FDA application overview or the label's DailyMed SPL)
  listed_latest: null             # the latest edition as that page lists it, e.g. "SUPPL-58 (2026-03-16)"
label_role: null                  # drug labels only: rld | reference-standard | manufacturer-site | repackager | other
population_limits: null           # who the source excludes or doesn't cover, and conditional/weak strength
                                  # e.g. ["not for people with pre-existing diabetes", "conditional recommendation"]
                                  # [] = checked, none stated · null = not checked
identifiers:
  doi: null
  pmid: null
  url: null
status: background                # decisive | background | superseded
superseded_by: null               # source ID, when status is superseded
topics: []                        # topic IDs that cite this source
funding_conflicts: null           # short note: industry funding, author conflicts, or "none declared"
verified:
  date: YYYY-MM-DD
  method: fetched-full-text       # fetched-full-text | fetched-abstract | resolved-doi | fetched-landing-page
  scope: full                     # how much you actually read: full | partial | section | abstract | summary | landing-page
  sections_read: null             # e.g. "§5 nutrition, Tables 5.1-5.3"; note truncation ("first 100k chars; read rest in parts")
  read_via: null                  # source ID, if you only read this through another document (a summary, journal scan)
  by: null                        # agent/model name, or "human"
findings:                         # paraphrased; never copied passages
  - claim: What the source found or recommends, in your own words
    locator: Section, table, figure or page
    population: Who it applies to (if narrower than the source overall)
    grade: null                   # the source's own grade or class, if it gives one
limitations: null
reviewer_read: false              # set only by the human reviewer (read in depth)
notes: null
