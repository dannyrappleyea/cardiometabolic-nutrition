findings:
  - claim: The 8/2026 Boxed Warning lists lactic acidosis risk factors including kidney impairment, age 65 or older, contrast imaging, surgery and other procedures, low-oxygen states, excessive alcohol intake, liver impairment and (newly) mitochondrial disease.
    locator: Boxed Warning; Recent Major Changes
    population: null
    grade: null
  - claim: Alcohol strengthens metformin's effect on lactate, so excessive intake should be avoided; the drug should be paused for surgery and other procedures and during periods of restricted food and fluid intake because of dehydration and kidney risk.
    locator: §5.1; §7; §17
    population: null
    grade: null
  - claim: About 7% of trial patients developed low vitamin B12, usually reversible with stopping or supplementation; blood counts should be checked yearly and B12 every 2-3 years.
    locator: §5.2
    population: null
    grade: null
  - claim: Taken once daily with the evening meal and swallowed whole; food raises total absorption by about 60%; diarrhea and nausea or vomiting are the most common effects; hypoglycemia risk rises mainly with insulin or sulfonylureas.
    locator: §2; §5.3; §6; §12.3; §17
    population: null
    grade: null
limitations: Extended-release product. Immediate-release administration text (taken with meals) was last seen in the discontinued Glucophage label; a current immediate-release metformin label (FDA reference standard or an ANDA) was not opened.
reviewer_read: false
notes: >-
  Why this label - Glucophage/Glucophage XR (NDA 020357/021202), the original metformin reference listed drug,
  is discontinued and its last label is from 2018. Fortamet is a currently listed NDA metformin label that carries
  the 8/2026 Boxed Warning and §5.1 revision, so it is used as the current class label. Supersedes
  fda-label-glucophage-metformin-2018.
