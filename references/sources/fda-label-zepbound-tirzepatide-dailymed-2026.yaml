findings:
  - claim: Used with a reduced-calorie diet and more physical activity for long-term weight reduction; injected once weekly at any time of day, with or without meals.
    locator: §1; §2
    population: Adults with obesity or overweight plus a weight-related condition
    grade: null
  - claim: Gastrointestinal reactions can be severe; vomiting, diarrhea or nausea can cause fluid loss and acute kidney injury, so patients should take steps to avoid dehydration, drink fluids and report persistent symptoms.
    locator: §5; §17; Medication Guide
    population: null
    grade: null
  - claim: Warnings also cover gallbladder disease, pancreatitis, pulmonary aspiration during anesthesia linked to delayed stomach emptying, worsening diabetic retinopathy with rapid glucose improvement (08/2026), sudden one-eye vision loss (NAION, 11/2026), and hypoglycemia with insulin or sulfonylureas.
    locator: §5 (Recent Major Changes)
    population: null
    grade: null
  - claim: Delayed stomach emptying can change absorption of oral medicines; people using oral hormonal contraceptives should switch to a non-oral method or add a barrier method for 4 weeks after starting and after each dose increase. Section 17 and the Medication Guide give no portion-size, meal or alcohol advice.
    locator: §7; §17; Medication Guide
    population: null
    grade: null
limitations: The weight-loss size and the regain-after-withdrawal results recorded from SUPPL-50 were not re-read in this version.
