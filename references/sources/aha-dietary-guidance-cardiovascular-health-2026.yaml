findings:
  - claim: Updates the 2021 guidance with nine features of a heart-healthy pattern - energy balance for a healthy weight; plenty of varied fruit and vegetables (canned and frozen can be nutritious); mostly whole grains; protein mainly from legumes, nuts and seeds, regular fish and seafood, low-fat or fat-free dairy and, if red meat is eaten, lean unprocessed cuts in limited portions; unsaturated fats (nuts, seeds, avocado, nontropical plant oils) in place of saturated fats; minimally rather than ultra-processed foods; limited added sugars and sugary drinks; low-sodium choices with little or no added salt; and not starting alcohol, or limiting it.
    locator: Via AHA news release (the nine features)
    population: General US population from age 1
    grade: null
  - claim: AHA describes the changes from 2021 as modest - protein advice now accepts several plant and animal sources and encourages replacing red meat, while calling the evidence on total protein amount uncertain; fat advice favors unsaturated over saturated sources broadly and says following the pattern is unlikely to exceed 10% of energy from saturated fat, in line with the 2025-2030 Dietary Guidelines for Americans; low-fat dairy stays preferred though its advantage over full-fat dairy is described as debated; more weight on low-sodium and potassium-rich foods; alcohol advice unchanged, with reference to HHS and WHO cancer statements.
    locator: Via AHA news release (what changed since 2021)
    population: null
    grade: null
  - claim: Most people following the pattern should not need supplements, with exceptions for some groups (such as pregnancy, some older adults and restricted diets), and the guidance is meant to apply wherever people eat, including restaurants and workplaces.
    locator: Via AHA news release
    population: null
    grade: null
limitations: Known only through AHA's own news release. Statement text, evidence grading and author disclosures not read; read it in full before any topic relies on it.
