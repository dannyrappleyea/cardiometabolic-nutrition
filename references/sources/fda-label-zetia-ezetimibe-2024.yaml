findings:
  - claim: An adjunct to diet to lower LDL-C, alone or with a statin (and with fenofibrate in mixed hyperlipidemia); also lowers plant sterols in homozygous sitosterolemia.
    locator: §1
    population: null
    grade: null
  - claim: Taken once daily with or without food - high-fat and non-fat meals did not change how much is absorbed, though a high-fat meal raised peak levels; it should be taken at least 2 hours before or 4 hours after a bile acid sequestrant, which lowers its exposure.
    locator: §2; §7; §12.3
    population: null
    grade: null
  - claim: The label gives no other diet or supplement advice; it notes liver-enzyme rises with statins, muscle problems mostly with statins or fibrates, and gallstone checks if suspected with fenofibrate.
    locator: §5; §7; §17
    population: null
    grade: null
limitations: Read from the NDA holder's own PDF; the Drugs@FDA supplement matching the 2/2024 revision was not identified.
