findings:
  - claim: Indicated with statins to lower cardiovascular events in adults with triglycerides of 150 mg/dL or more and established heart disease or diabetes plus at least two risk factors, and as an adjunct to diet for triglycerides of 500 mg/dL or more; other causes of high triglycerides should be assessed first.
    locator: §1; §2
    population: null
    grade: null
  - claim: Taken as 4 g a day in two doses with food, capsules swallowed whole.
    locator: §2
    population: null
    grade: null
  - claim: Raises the risk of atrial fibrillation or flutter and of bleeding (more so with antithrombotic drugs); people allergic to fish or shellfish may react and should stop if they do; in the outcomes trial common reactions included musculoskeletal pain, swelling, constipation, gout and atrial fibrillation.
    locator: §5; §6; §7
    population: null
    grade: null
  - claim: The patient leaflet says a diet low in saturated fat, cholesterol, carbohydrate and added sugar may be recommended and asks patients to report all vitamins and dietary or herbal supplements.
    locator: Patient information
    population: null
    grade: null
limitations: Read from the NDA holder's own PDF, not DailyMed; the fetch did not confirm every later section.
