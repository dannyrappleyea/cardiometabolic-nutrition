findings:
  - claim: Health risk rises along a continuum - 1-2 standard drinks a week low risk, 3-6 moderate (higher risk of several cancers), 7 or more increasingly high (significantly higher heart disease and stroke risk) - and less is better at any level.
    locator: Risk continuum
    population: Adults
    grade: null
  - claim: The guidance states evidence no longer supports alcohol being good for health and that no healthy amount has been identified; more than 2 drinks on one occasion raises injury risk.
