findings:
  - claim: The guideline replaces the 2017 ACC/AHA high blood pressure guideline; its literature search covered human studies published since February 2015 and ran from December 2023 to June 2024.
    locator: Abstract (PubMed)
    population: Adults
    grade: null
  - claim: According to the issuing body's own public summary, the guideline keeps the 2017 categories (normal under 120/80; elevated 120-129 systolic with diastolic under 80; stage 1 130-139 or 80-89; stage 2 140 or higher or 90 or higher) and calls readings above 180 systolic and/or above 120 diastolic severe hypertension, or a hypertensive emergency when symptoms are present.
    locator: Via aha-high-bp-top-10-2025 (category table)
    population: Non-pregnant adults
    grade: null
  - claim: Updated areas include lifestyle and psychosocial approaches, resistant hypertension, diabetes and chronic kidney disease; urine albumin-to-creatinine testing is now recommended for everyone with high blood pressure; GLP-1 medicines may be considered for some people with high blood pressure and overweight or obesity; the PREVENT calculator replaces the pooled cohort equations for risk estimation.
    locator: Via acc-hbp-guideline-journal-scan-2025
    population: Adults with high blood pressure
    grade: null
limitations: Read only through the abstract and two summaries by the issuing bodies; classes of recommendation, levels of evidence and the lifestyle section text were not seen. Cannot be decisive for a reviewed topic until the full text is read.
