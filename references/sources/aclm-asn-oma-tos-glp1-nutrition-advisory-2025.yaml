findings:
- claim: Higher protein targets of 1.2-1.6 g/kg/day (or about 80-120 g/day) have been proposed during active weight
    loss on GLP-1 therapy; prolonged intakes of 2 g/kg/day or more should be avoided.
  locator: Preservation of muscle and bone mass
  population: Adults with obesity on GLP-1 medicines
  grade: null
- claim: Iron, calcium, magnesium, zinc and vitamins A, D, E, K, B1, B12 and C are at risk of inadequate intake,
    especially below about 1,200 kcal/day (women) or 1,800 kcal/day (men).
  locator: Nutritional deficiencies
  population: null
  grade: null
- claim: Small frequent meals, avoiding large or very fatty meals early, gradual fibre, adequate fluids and minimal
    alcohol help manage gastrointestinal side effects; dehydration can cause acute kidney injury.
  locator: Management of GI side effects; Table 6
  population: null
  grade: null
- claim: Resistance training at least three times weekly plus 150 minutes of aerobic activity is advised to preserve
    lean mass.
  locator: Preservation of muscle and bone mass
  population: null
  grade: null
- claim: Up to two-thirds of lost weight may return within a year of stopping.
  locator: Overview of efficacy
  population: null
  grade: null
