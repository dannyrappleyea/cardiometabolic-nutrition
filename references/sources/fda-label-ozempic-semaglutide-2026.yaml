findings:
  - claim: Indicated as an adjunct to diet and exercise in type 2 diabetes, and to reduce cardiovascular events and kidney outcomes in specified groups; injected weekly with or without meals.
    locator: §1; §2.2
    population: Adults with type 2 diabetes
    grade: null
  - claim: Nausea, vomiting, diarrhea, abdominal pain and constipation are the most common side effects; acute kidney injury has been reported, mostly after dehydration from these effects; severe GI reactions are more frequent than with placebo and use is not recommended with severe gastroparesis.
    locator: §5.6-5.7; §6
    population: null
    grade: null
  - claim: Gallbladder disease (gallstones) was more common than with placebo; acute pancreatitis is a warning; hypoglycemia risk rises with insulin or sulfonylureas.
    locator: §5.2; §5.5; §5.9
    population: null
    grade: null
  - claim: Delayed gastric emptying has been linked to rare pulmonary aspiration during anesthesia even after recommended fasting; patients should tell providers before procedures.
    locator: §5.10
    population: null
    grade: null
limitations: Later sections not read.
