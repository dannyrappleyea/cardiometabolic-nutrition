findings:
  - claim: Most people need not worry about mercury from fish, but adults should limit fresh or frozen tuna, shark, swordfish, marlin, orange roughy and escolar to about 150 g a week, with other fish making up the rest; canned light tuna is not covered by this limit.
    locator: Consumption advice
    population: General adult population
    grade: null
  - claim: Fish such as anchovy, char, hake, herring, Atlantic mackerel, pollock, salmon, smelt, rainbow trout, shrimp, clams, mussels and oysters are lower in mercury and higher in omega-3 fats; the page links fish to a healthy eating pattern and its omega-3 fats to lower risk of sudden cardiac death.
    locator: Lower-mercury fish; benefits
    population: null
    grade: null
limitations: Covers mercury only; no other contaminants discussed. Tier 6 (food-safety explainer), so useful for data, not rules.
