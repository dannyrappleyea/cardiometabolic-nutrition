findings:
- claim: MASLD is steatotic liver disease with at least one cardiometabolic risk factor and without harmful alcohol
    intake.
  locator: Abstract; Introduction
  population: null
  grade: null
- claim: Sustained weight loss of at least 5% reduces liver fat, 7-10% improves inflammation and at least 10% improves
    fibrosis.
  locator: Non-pharmacological therapy
  population: MASLD with overweight
  grade: LoE 2, strong
- claim: A Mediterranean-like diet, limiting ultra-processed foods high in sugar and saturated fat and avoiding
    sugar-sweetened beverages is recommended.
  locator: Diet quality recommendation
  population: null
  grade: LoE 2, strong
- claim: Alcohol should be discouraged, and stopped completely in advanced fibrosis or cirrhosis; evidence does
    not support a protective effect of light-to-moderate drinking.
  locator: Alcohol recommendations
  population: null
  grade: LoE 3, strong
- claim: Coffee intake is associated with less liver damage in observational studies (a statement, not a recommendation);
    nutraceuticals cannot be recommended.
  locator: Nutraceuticals statements
  population: null
  grade: LoE 4; LoE 2
limitations: Executive summary; MetALD alcohol thresholds were in supplementary tables not opened.
