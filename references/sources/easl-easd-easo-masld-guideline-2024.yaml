findings:
  - claim: Adults with MASLD and overweight should aim for sustained weight loss of about 5% to reduce liver fat, 7-10% to improve inflammation and at least 10% to improve fibrosis.
    locator: Lifestyle recommendations
    population: Adults with MASLD and overweight/obesity
    grade: LoE 2, strong
  - claim: Diet quality should improve toward a Mediterranean-like pattern, limiting ultra-processed foods high in sugar and saturated fat and avoiding sugar-sweetened beverages; nutraceuticals are not recommended.
    locator: Lifestyle recommendations
    population: Adults with MASLD
    grade: LoE 2, strong (nutraceuticals open)
  - claim: Alcohol should be discouraged in all people with steatotic liver disease and stopped completely with advanced fibrosis or cirrhosis; coffee intake is associated with better liver outcomes in observational studies.
    locator: Lifestyle recommendations
    population: Adults with MASLD
    grade: LoE 3 strong; LoE 4
  - claim: MASLD is steatotic liver disease with at least one cardiometabolic risk factor and no harmful alcohol intake; BMI cut-offs for Asian people are lower (overweight 23-24.9, obesity 25 or more).
    locator: Definition; Figure 3 caption
    population: null
    grade: null
  - claim: GLP-1 receptor agonists, pioglitazone, SGLT2 inhibitors, metformin and statins are safe in MASLD and used for their usual indications, but none except resmetirom (where approved) is recommended as liver-targeted therapy.
    locator: Pharmacotherapy recommendations
    population: Adults with MASLD/MASH
    grade: LoE 1-5 as stated
limitations: Executive summary; supplementary tables not read.
reviewer_read: false
notes: Its Asian BMI cut-offs (obesity 25 or more) differ from NICE NG246 (27.5 or more), which matters for SCOPE's body-size row.
