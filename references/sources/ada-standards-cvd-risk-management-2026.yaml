findings:
  - claim: In diabetes, hypertension is defined as 130 systolic or 80 diastolic or higher, the usual target is under 130/80, and a systolic goal under 120 is encouraged for people at high cardiovascular or kidney risk.
    locator: Recs 10.1, 10.4
    population: Adults with diabetes
    grade: A
  - claim: For blood pressure above 120/80, lifestyle advice covers weight loss when indicated, a DASH-style pattern, sodium under 2,300 mg a day, limiting alcohol, and physical activity; the text mentions 8-10 servings of fruit and vegetables and 2-3 of low-fat dairy daily.
    locator: Rec 10.5 and text
    population: Adults with diabetes
    grade: A
  - claim: Serum potassium and eGFR should be monitored with ACE inhibitors, ARBs or mineralocorticoid receptor antagonists, and potassium should be watched for falls with diuretics; first-line drug classes are ACE inhibitors, ARBs, thiazide-like diuretics and dihydropyridine calcium channel blockers.
    locator: Recs 10.7-10.13
    population: Adults with diabetes
    grade: A-B
  - claim: Lifestyle for lipids covers weight loss if indicated, a Mediterranean or DASH pattern, less saturated and trans fat, more n-3 fatty acids, soluble fiber and plant stanols/sterols, and more physical activity.
    locator: Rec 10.14
    population: Adults with diabetes
    grade: A
  - claim: Adults 40-75 without ASCVD should take at least a moderate-intensity statin, with high-intensity and an LDL goal under 70 mg/dL for those at higher risk; ezetimibe or a PCSK9 inhibitor may be added.
    locator: Recs 10.18, 10.20, 10.21
    population: Adults with diabetes aged 40-75
    grade: A-B
  - claim: Triglycerides of 150 mg/dL or more (fasting; 175 non-fasting) or low HDL (under 40 men, under 50 women) call for intensified lifestyle therapy; fasting triglycerides of 500 or more call for evaluation of secondary causes and consideration of medicine to reduce pancreatitis risk; icosapent ethyl may be considered for people on statins with triglycerides 150-499 and ASCVD or risk factors, while other n-3 supplements, fibrates and niacin are not advised on top of statins for cardiovascular benefit.
    locator: Recs 10.15, 10.29-10.32
    population: Adults with diabetes
    grade: B-C
  - claim: Established ASCVD is defined as a history of acute coronary syndrome, heart attack, angina, coronary or other arterial revascularization, stroke or peripheral artery disease.
    locator: Section introduction
    population: null
    grade: null
