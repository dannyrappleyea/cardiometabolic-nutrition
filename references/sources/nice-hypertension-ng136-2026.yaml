findings:
  - claim: A clinic reading of 140/90 mmHg or more is confirmed with ambulatory or home monitoring (average 135/85 or more); stage 2 is clinic 160/100 up to 180/120; severe hypertension is clinic 180/120 or more, and with retinal haemorrhage or papilloedema (accelerated hypertension) or life-threatening symptoms it needs same-day specialist assessment.
    locator: Recommendations, diagnosis section
    population: Adults
    grade: null
  - claim: Lifestyle advice covers diet, exercise, alcohol and smoking; salt intake should be cut, but potassium-based salt substitutes should be avoided by older people, people with diabetes or kidney disease, pregnant women and people taking some blood pressure medicines such as ACE inhibitors or ARBs; calcium, magnesium or potassium supplements should not be offered to lower blood pressure; excessive caffeine should be discouraged.
    locator: Recommendations, lifestyle interventions section
    population: null
    grade: null
  - claim: Resistant hypertension is blood pressure uncontrolled despite optimal tolerated doses of an ACE inhibitor or ARB, a calcium channel blocker and a thiazide-like diuretic; readings should first be confirmed by ambulatory or home monitoring and adherence discussed, and low-dose spironolactone is considered only if blood potassium is 4.5 mmol/L or lower.
    locator: Recommendations, step 4 treatment
    population: null
    grade: null
  - claim: Clinic targets are below 140/90 mmHg under age 80 and below 150/90 at 80 or over, with separate tables for CKD and type 1 diabetes.
    locator: Recommendations, treatment targets
    population: null
    grade: null
