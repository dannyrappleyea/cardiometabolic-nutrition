findings:
  - claim: Used with a reduced-calorie diet and increased physical activity for weight reduction and maintenance; mean weight change over 72 weeks was about -21% at the top dose versus -3% on placebo, and stopping the drug led to regain in a withdrawal study.
    locator: §1; §14 Tables 2 and 6
    population: Adults with obesity or overweight plus comorbidity
    grade: null
  - claim: Gastrointestinal side effects affected 56% versus 30% on placebo, mostly during dose increases; patients should avoid fluid depletion because dehydration has caused acute kidney injury.
    locator: §5.2-5.3; §6.1; §17
    population: null
    grade: null
  - claim: Gallbladder problems (gallstones, cholecystitis) were more common than with placebo; delayed gastric emptying lowers peak levels of oral drugs, and people using oral hormonal contraceptives should add or switch method for 4 weeks after starting and each dose increase.
    locator: §5.4; §7.2; §8.3; §12.3
    population: null
    grade: null
  - claim: Injected once weekly with or without meals; Section 17 gives hydration advice but no specific nutrition counseling.
    locator: §2.4; §17
    population: null
    grade: null
limitations: null
