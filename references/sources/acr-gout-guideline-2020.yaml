    grade: null
  - claim: For people with gout and hypertension, switching hydrochlorothiazide to losartan where possible is suggested; low-dose aspirin is continued when indicated; changing cholesterol therapy to fenofibrate for gout is not recommended.
    locator: Via AAFP summary
    population: People with gout
    grade: null
  - claim: The urate-lowering target is a serum urate of 6 mg/dL or less.
