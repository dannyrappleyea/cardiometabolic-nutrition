findings:
  - claim: Ten features of a heart-healthy pattern - energy balance, plenty of varied fruit and vegetables, whole grains, healthy protein sources (legumes and nuts, fish, low-fat dairy, lean unprocessed meat if eaten), liquid plant oils instead of tropical oils and animal fats, minimally processed foods, limited added sugars and sugary drinks, little or no added salt, limiting or not starting alcohol, and applying this wherever food is prepared.
    locator: Via ACC summary, points 1-10
    population: General adults
    grade: null
  - claim: The statement notes there is no agreed definition of ultra-processed foods and that some healthy foods may fall into the category, while high intake is associated with obesity, type 2 diabetes, CVD and death.
    locator: Via ACC summary, point 6
