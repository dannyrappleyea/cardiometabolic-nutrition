findings:
  - claim: Lifestyle measures with the largest LDL-C effect (5-10%) are avoiding trans fats, reducing saturated fat, more dietary fiber, plant-sterol-enriched foods, red yeast rice products and reducing excess weight; reducing dietary cholesterol has a smaller effect.
    locator: Table 8 (p. 134)
    population: Adults with dyslipidaemia
    grade: Level A (cholesterol B)
  - claim: For triglycerides, cutting alcohol has the largest effect (over 10%), with weight loss, physical activity, less total carbohydrate, n-3 supplements and fewer mono- and disaccharides also lowering levels.
    locator: Table 8 (p. 134)
    population: null
    grade: Level A-B
  - claim: Food-choice table grades foods into prefer, moderate and occasional across cereals, vegetables, legumes, fruit, sweets and sweeteners, meat and fish, dairy and eggs, cooking fats, nuts and seeds, and cooking methods.
    locator: Table 9 (p. 135)
    population: null
    grade: null
  - claim: Quantitative targets in the text include saturated fat under 10% of energy (under 7% with high cholesterol), dietary cholesterol under 300 mg/day, carbohydrate 45-55% of energy, fiber 25-40 g/day with 7-13 g soluble, added sugar under 10% of energy, and alcohol up to about 10 g/day only if triglycerides are not raised.
    locator: §7.2-7.4.4 (pp. 135-137)
    population: null
    grade: null
  - claim: About 2 g/day of plant sterols or stanols lowers LDL-C by roughly 7-10%; beta-glucan 3-10 g/day lowers LDL-C 3-5%; prescription-dose n-3 (2-3 g/day) lowers triglycerides about 30%; evidence for soy, policosanol and berberine is weak or absent.
    locator: §7.5.1-7.5.6 (pp. 136-137)
    population: null
    grade: null
  - claim: Weight loss of 5-10% improves lipids, with an energy deficit of 300-500 kcal/day suggested; triglycerides above 150 mg/dL (1.7 mmol/L) fasting mark raised CVD risk; LDL-C above 190 mg/dL (4.9 mmol/L) with suspected FH places people at least at high risk.
    locator: §7.1; §8.13 (p. 145); §4 risk categories
    population: null
    grade: null
limitations: §6, §9.2 onward and §13 not read in this run.
