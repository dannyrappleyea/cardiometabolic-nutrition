findings:
  - claim: Replaces the 2018 blood cholesterol guideline and widens scope to dyslipidemias in general, including hypertriglyceridemia and elevated lipoprotein(a).
    locator: Abstract
    population: null
    grade: null
  - claim: Reinstates LDL-C and non-HDL-C goals; LDL-C goals reported as under 100 mg/dL for borderline or intermediate risk, under 70 for high risk, and under 55 for very-high-risk ASCVD; PREVENT-ASCVD replaces the pooled cohort equations for adults 30-79.
    locator: Via ACC journal scan and AHA news release
    population: Adults
    grade: null
  - claim: Lifestyle change is described as the first step, with statins first-line drug therapy and ezetimibe, bempedoic acid or PCSK9 antibodies as add-ons; triglyceride-lowering therapy is considered to prevent pancreatitis especially at triglycerides of 1,000 mg/dL or more.
    locator: Via ACC journal scan
    population: Adults
    grade: null
  - claim: Lipoprotein(a) should be measured at least once in adulthood and is little affected by lifestyle; apoB can help assess residual risk in people with diabetes, high triglycerides or cardiovascular-kidney-metabolic syndrome.
    locator: Via ACC journal scan
    population: null
    grade: null
limitations: Known only through summaries; the dietary recommendations, triglyceride categories and severe-hypercholesterolemia definitions were not seen. Cannot be decisive until the full text is read.
