findings:
  - claim: Insulin should be considered, whatever other medicines are used, when there are symptoms of high glucose or when A1C is above 10% or glucose 300 mg/dL or more; starting two glucose-lowering drugs together may be considered when A1C is 1.5-2.0 percentage points above the person's goal.
    locator: Rec 9.20; type 2 diabetes treatment text
    population: Adults with type 2 diabetes
    grade: null
  - claim: When a new glucose-lowering drug is added, the need for and dose of agents with higher hypoglycemia risk - sulfonylureas, meglitinides and insulin - should be reassessed; metformin used alone does not cause hypoglycemia.
    locator: Rec 9.17; metformin text
    population: Adults with type 2 diabetes
