findings:
- claim: CKD is present when, for more than 3 months, GFR is below 60 or there is a marker of kidney damage such
    as albuminuria with ACR of 30 mg/g or more.
  locator: Table 1, p. S137
  population: null
  grade: null
- claim: 'GFR categories: G1 90 or more, G2 60-89, G3a 45-59, G3b 30-44, G4 15-29, G5 below 15. Albuminuria categories:
    A1 below 30, A2 30-300, A3 above 300 mg/g.'
  locator: Tables 2-3, p. S137
  population: null
  grade: null
- claim: Protein intake of about 0.8 g/kg/day is recommended in CKD G3-G5, and intakes above 1.3 g/kg/day should
    be avoided in adults at risk of progression.
  locator: Recommendation 3.3.1.1; Practice Point 3.3.1.1
  population: CKD G3-G5
  grade: 2C
- claim: Sodium intake below 2 g/day (about 5 g salt) is recommended in CKD.
  locator: Recommendation 3.3.2.1
  population: CKD
  grade: 2C
- claim: Healthy, diverse diets favoring plant-based foods and limiting ultraprocessed foods are advised, with renal
    dietitian input on sodium, phosphorus, potassium and protein.
  locator: Practice Points 3.3.1, 3.3.2
  population: CKD
  grade: null
- claim: After hyperkalemia, or to prevent it when risk is a concern, limiting foods rich in bioavailable potassium
    such as processed foods is advised.
  locator: Practice Point 3.11.5.2
  population: CKD G3-G5
  grade: null
