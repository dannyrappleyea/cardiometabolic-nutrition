findings:
  - claim: CKD is kidney damage (such as albumin-to-creatinine ratio of 30 mg/g or more) or eGFR under 60 for at least 3 months; GFR categories are G1 90+, G2 60-89, G3a 45-59, G3b 30-44, G4 15-29, G5 under 15; albuminuria categories are A1 under 30, A2 30-300 and A3 over 300 mg/g.
    locator: Tables 1-3 (p. S137)
    population: null
    grade: null
  - claim: Adults with CKD G3-G5 should keep protein intake at about 0.8 g/kg/day and avoid more than 1.3 g/kg/day if at risk of progression; sodium under 2 g a day is suggested; plant-based foods are favored over animal foods and ultra-processed foods limited.
    locator: Rec 3.3.1.1 (2C); PP 3.3.1.1; Rec 3.3.2.1 (2C); PP 3.3.1
    population: Adults with CKD
    grade: 2C and practice points
  - claim: Potassium should be checked within 2-4 weeks of starting or raising an ACE inhibitor or ARB; for people with a history of high potassium, foods high in bioavailable potassium (such as processed foods) may be limited, with renal dietitian input.
    locator: PP 3.6.2-3.6.5; PP 3.11.5.1-3.11.5.2
    population: Adults with CKD
    grade: Practice points
  - claim: Medicines recommended include ACE inhibitors or ARBs for albuminuria, SGLT2 inhibitors, finerenone in type 2 diabetes with albuminuria, GLP-1 receptor agonists for type 2 diabetes not at target, and statins from age 50.
    locator: Recs 3.6.1-3.9.1, 3.15.1.1-3.15.1.3
    population: Adults with CKD
    grade: 1A-2C
  - claim: At least 150 minutes a week of moderate physical activity is recommended, and weight-loss advice may be considered for people with obesity and CKD.
    locator: Rec 3.2.2.1 (1D); PP 3.2.2.4
    population: Adults with CKD
    grade: 1D
limitations: Chapter 3 narrative text not read; recommendations taken from KDIGO's own summary document.
