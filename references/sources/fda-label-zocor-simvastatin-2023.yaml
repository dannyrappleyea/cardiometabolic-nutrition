findings:
  - claim: Grapefruit juice should be avoided during simvastatin treatment because it raises simvastatin levels (up to about 16-fold with high intake) and the risk of myopathy and rhabdomyolysis.
    locator: §5.1, §7.1 Table 2, §12.3 Table 4
    population: null
    grade: null
  - claim: Taken once daily in the evening; a low-fat meal did not change drug levels.
    locator: §2.1, §12.3
    population: null
    grade: null
  - claim: Lipid-modifying niacin doses (1 g/day or more) raise myopathy risk and are not recommended with simvastatin in Chinese patients, who have a higher myopathy rate.
    locator: §7.1, §8.8
    population: Chinese patients
    grade: null
  - claim: Heavy alcohol use may raise risk of liver injury; patients should report drinking more than two drinks a day and any vitamins or herbal supplements.
    locator: §5.3; patient information
    population: null
    grade: null
limitations: null
reviewer_read: false
notes: Shows that the grapefruit caution differs in strength between statins (avoid for simvastatin; avoid more than 1.2 L/day for atorvastatin).
