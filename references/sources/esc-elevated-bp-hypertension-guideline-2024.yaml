findings:
  - claim: Office blood pressure is classified as non-elevated (below 120/70), elevated (120-139 systolic or 70-89 diastolic) and hypertension (140/90 or higher).
    locator: §2 point 2; §8.4; Figure 19
    population: Adults
    grade: null
  - claim: Lifestyle recommendations include sodium of about 2 g a day (about 5 g salt) (I/A); a Mediterranean or DASH diet (I/A); BMI about 20-25 with waist under 94 cm (men) or 80 cm (women) (I/A); alcohol below about 100 g of pure alcohol a week, with not drinking preferred (I/B); free sugar at most 10% of energy and limiting sugar-sweetened drinks (I/B); and regular aerobic plus resistance exercise (I/A).
    locator: §8.2, Recommendation Table 15 (p. 3958)
    population: Adults with elevated BP or hypertension
    grade: Class I, Level A or B as listed
  - claim: Raising potassium intake by 0.5-1.0 g a day is suggested for people with high sodium intake who do not have moderate-to-advanced kidney disease, and serum potassium should be monitored when dietary potassium is raised in people with CKD or taking potassium-sparing drugs; potassium-enriched salt substitutes are described (75% sodium chloride, 25% potassium chloride).
    locator: §8.2, Recommendation Table 15; text p. 3955
    population: Excludes moderate-to-advanced CKD
    grade: IIa/A and IIa/C
  - claim: The text discusses weight loss (about 4.4/3.6 mmHg lower per 5 kg lost; 5-10% loss suggested), coffee (not linked to higher hypertension risk), tea (inconclusive), energy drinks (raise BP) and sugar-sweetened soft drinks.
    locator: §8.2 text pp. 3956-3957
    population: null
    grade: null
  - claim: Resistant hypertension is BP above goal despite three or more drugs of different classes at maximally tolerated doses, one being a diuretic; a hypertensive emergency is BP of 180/110 or higher with acute organ damage.
    locator: §9.13.1 (p. 3980), Table 11; §10.1.1 (p. 3983)
    population: Adults
    grade: null
  - claim: Systolic treatment target of 120-129 mmHg for most treated adults (I/A), with lenient targets for age 85 or older, frailty or symptomatic orthostatic hypotension.
    locator: Recommendation Table 18 (p. 3966)
    population: Treated adults
    grade: I/A
limitations: Body of §3-6 and supplementary evidence tables not read. Repository copy carries the ESC "personal and educational use" notice.
