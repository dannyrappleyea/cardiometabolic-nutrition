findings:
  - claim: About 7% of patients in trials developed subnormal vitamin B12, possibly from reduced absorption; people with low B12 or calcium intake may be more prone, and B12 should be checked every 2-3 years.
    locator: §5.2; §6.1
    population: null
    grade: null
  - claim: Alcohol strengthens metformin's effect on lactate; excessive or binge drinking should be avoided because it raises lactic acidosis risk.
    locator: Boxed warning; §5.1; §7; §17
    population: null
    grade: null
  - claim: Immediate-release metformin is taken with meals to reduce stomach upset (diarrhea and nausea are common); extended-release is taken with the evening meal; food lowers immediate-release absorption somewhat and raises extended-release exposure.
    locator: §2.1; §6.1; §12.3
    population: null
    grade: null
  - claim: Hypoglycemia is mainly a risk when metformin is combined with insulin or secretagogues, or when people do not eat enough or drink alcohol.
    locator: §5.3; patient information
    population: null
    grade: null
limitations: Label dated 2018 and brand discontinued.
