findings:
  - claim: Hypertension is defined as blood pressure of 130/80 mmHg or higher, confirmed with home or ambulatory monitoring (or a repeat office visit if those are not feasible); drug treatment is recommended from 140/90, or from systolic 130-139 at high cardiovascular risk, with a systolic target below 130 for most adults.
    locator: Diagnosis; treatment thresholds and targets
    population: Adults in primary care
    grade: null
  - claim: Health-behaviour advice is sodium under 2 g a day (most comes from processed foods), potassium above 3.5 g a day from fruit and vegetables with potassium monitoring for people with CKD or on ACE inhibitors, ARBs or mineralocorticoid antagonists, weight loss for people with obesity, 150-300 minutes of moderate activity a week, less alcohol (especially above two drinks a day) and stopping smoking.
    locator: Health behaviours section
    population: null
    grade: null
  - claim: First-line drugs are ACE inhibitors or ARBs, thiazide or thiazide-like diuretics and long-acting dihydropyridine calcium channel blockers, preferably as low-dose single-pill combinations; resistant hypertension is blood pressure above target despite adherence to all three at maximally tolerated doses, with spironolactone suggested as the add-on.
    locator: Drug treatment; algorithm
    population: null
    grade: null
  - claim: No numeric threshold is given for severe hypertension, urgency or emergency; severe or malignant hypertension appears only as a reason to look for secondary causes.
    locator: Algorithm
    population: null
    grade: null
limitations: The guideline does not discuss potassium-enriched salt substitutes directly.
