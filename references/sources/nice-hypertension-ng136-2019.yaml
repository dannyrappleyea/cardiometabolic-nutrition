findings:
- claim: Clinicians should ask about diet and exercise and give lifestyle guidance; excessive coffee and other caffeine-rich
    products are discouraged; low sodium intake is encouraged by reducing or substituting sodium salt.
  locator: Section 1.3 lifestyle interventions
  population: null
  grade: 2004 recommendations
- claim: Potassium-based salt substitutes should not be used by older people, people with diabetes, pregnant women,
    people with kidney disease or people taking some antihypertensives such as ACE inhibitors and ARBs; salt reduction
    is advised instead.
  locator: Section 1.3, salt substitute recommendation [2004, amended 2019]
  population: null
  grade: null
- claim: Calcium, magnesium or potassium supplements should not be offered to lower blood pressure.
  locator: Section 1.3
  population: null
  grade: null
- claim: Stage 1 hypertension is clinic BP 140/90-159/99 (home or ambulatory 135/85-149/94); stage 2 is clinic BP
    160/100 to below 180/120; severe hypertension is clinic systolic 180 or diastolic 120 or higher.
  locator: Terms used in this guideline
  population: null
  grade: null
- claim: Resistant hypertension corresponds to BP uncontrolled on optimal tolerated doses of an ACE inhibitor or
    ARB plus a calcium-channel blocker and a thiazide-like diuretic.
  locator: Step 4 treatment recommendations
  population: null
  grade: null
