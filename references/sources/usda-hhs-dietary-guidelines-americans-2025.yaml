findings:
  - claim: The current edition's headline message is to eat whole, nutrient-dense foods, prioritizing protein, dairy, vegetables, fruit, healthy fats and whole grains, and to reduce highly processed foods high in refined carbohydrate, added sugar, excess sodium, unhealthy fats and additives.
    locator: ODPHP Current Dietary Guidelines page
    population: General population
    grade: null
  - claim: Reported amounts include protein of 1.2-1.6 g/kg/day, three daily servings of full-fat dairy without added sugar, three of vegetables, two of fruit and two to four of whole grains (2,000 kcal), saturated fat at or under 10% of calories, avoiding added sugars and non-nutritive sweeteners, and olive oil, butter or beef tallow as cooking fats.
    locator: Via AAFP summary
    population: General population
    grade: null
  - claim: Per the ACC work-group commentary, sodium stays under 2,300 mg a day and alcohol is to be limited without a set amount; the higher protein target was not in the 2025 advisory committee report.
    locator: Via acc-dga-cardiovascular-commentary-2026
    population: null
    grade: null
limitations: Known through summaries only. US federal source; METHODS §3 requires non-federal corroboration and notes federal guidance can shift for non-scientific reasons.
