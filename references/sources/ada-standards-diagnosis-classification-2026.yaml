findings:
  - claim: Prediabetes is defined by A1C 5.7-6.4%, fasting plasma glucose 100-125 mg/dL, or 2-hour glucose 140-199 mg/dL on a 75 g oral glucose tolerance test.
    locator: Table 2.2
    population: Nonpregnant adults
    grade: null
  - claim: Diabetes is diagnosed at A1C 6.5% or higher, fasting glucose 126 mg/dL or higher, 2-hour OGTT glucose 200 mg/dL or higher, or random glucose 200 mg/dL or higher with symptoms; without clear hyperglycemia two abnormal results are needed.
    locator: Table 2.1; Rec 2.1b
    population: Nonpregnant adults
    grade: null
  - claim: Screening is advised for adults with overweight or obesity (BMI 25 or higher, or 23 or higher in people of Asian ancestry) plus a risk factor, and for everyone from age 35; people with prediabetes should be retested yearly.
    locator: Table 2.5; Recs 2.11-2.12
    population: Adults
    grade: null
  - claim: A1C may be unreliable with anemia, hemodialysis, erythropoietin or HIV treatment, some hemoglobin variants and G6PD deficiency; glucose criteria should then be used.
    locator: Table 2.3; Recs 2.2b-2.4
    population: null
    grade: null
limitations: Read diagnostic and screening parts only.
