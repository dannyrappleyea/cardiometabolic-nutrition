findings:
- claim: Diabetes is diagnosed at A1C 6.5% or higher, fasting plasma glucose 126 mg/dL or higher, 2-hour OGTT glucose
    200 mg/dL or higher, or random glucose 200 mg/dL or higher with classic symptoms; without unequivocal hyperglycemia
    two abnormal results are needed.
  locator: Table 2.1; Recommendations 2.1a-2.1b
  population: Nonpregnant adults
  grade: null
- claim: Prediabetes is A1C 5.7-6.4%, fasting glucose 100-125 mg/dL (impaired fasting glucose) or 2-hour OGTT glucose
    140-199 mg/dL (impaired glucose tolerance). WHO and some others use a lower impaired-fasting-glucose limit of
    110 mg/dL.
  locator: Table 2.2; section Diagnosis of Prediabetes
  population: null
  grade: null
- claim: Screening is considered for adults with BMI 25 or higher, or 23 or higher for people of Asian ancestry,
    who have an additional risk factor; all others are screened from age 35.
  locator: Table 2.5; Recommendations 2.12a-2.12b
  population: null
  grade: null
- claim: Slowly progressive autoimmune diabetes in adults (often called LADA) is classified under type 1 diabetes.
  locator: Discussion following Table 2.4
  population: null
  grade: null
