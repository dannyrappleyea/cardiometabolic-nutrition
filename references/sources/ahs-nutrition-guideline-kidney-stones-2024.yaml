findings:
  - claim: For stone prevention, aim for about 2.5 L of urine a day, sodium around 1,500 mg (not above 2,300), calcium mainly from food at the recommended intake, protein not above the recommended intake with less animal protein, more fruit and vegetables, and fewer sugar-sweetened (especially fructose-sweetened) drinks.
    locator: Recommendations
    population: Adults with or at risk of kidney stones
    grade: null
  - claim: Routine oxalate restriction is not advised unless urinary oxalate is high or absorption is increased; vitamin C supplements over 1,000 mg/day are not advised for people with calcium oxalate stones; ketogenic diets may affect urine pH and stone risk.
    locator: Oxalate, vitamin C and weight sections
    population: Adults with stone history
    grade: null
  - claim: The document draws on the Canadian Urological Association 2022 and AUA 2014 kidney stone guidelines and on Canada's Guidance on Alcohol and Health (2023).
    locator: References
    population: null
    grade: null
