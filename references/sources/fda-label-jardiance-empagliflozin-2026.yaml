findings:
- claim: Ketoacidosis can occur even with near-normal glucose; precipitating factors include reduced caloric intake, ketogenic diet, surgery or prolonged fasting, volume depletion and alcohol abuse; the drug should be withheld at least 3 days before procedures with prolonged fasting where possible.
  locator: §5.1; §2.3
  population: null
  grade: null
- claim: Can cause volume depletion and low blood pressure, especially in older adults, people with eGFR under 60 or on loop diuretics; genital fungal infections are more common than with placebo.
  locator: §5.2-5.3; §6.1; §8.5
  population: null
  grade: null
- claim: Taken in the morning with or without food (a high-fat meal lowers exposure modestly, judged not clinically relevant); urine glucose tests are positive and should not be used for monitoring.
