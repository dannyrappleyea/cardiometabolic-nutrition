findings:
  - claim: The public eating pattern has five steps - vegetables, fruit and wholegrains; mainly plant protein and fish, with smaller amounts of eggs and poultry and lean red meat 1-3 times a week; unflavoured milk, yoghurt and cheese (reduced-fat for people with heart disease or high cholesterol); healthy fats and oils with fish 2-3 times a week; herbs and spices instead of salt (maximum 5 g salt a day).
    locator: Five steps
    population: General public
    grade: null
  - claim: People with heart disease, high LDL cholesterol or type 2 diabetes are advised to eat no more than 7 eggs a week; most others need not limit eggs.
    locator: Eggs
    population: Heart disease, high LDL or type 2 diabetes
    grade: null
  - claim: Water is the drink of choice, a small glass (125 ml) of juice is acceptable, sugary drinks are not recommended and alcohol is not recommended for heart health; ultra-processed foods and takeaway should be eaten only sometimes, though not all processed foods need avoiding; a plate model (half vegetables, a quarter protein, a quarter carbohydrate) and label reading are suggested.
    locator: Drinks; ultra-processed foods; portions; tips
    population: null
    grade: null
