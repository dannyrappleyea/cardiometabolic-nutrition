findings:
  - claim: For prevention of type 2 diabetes, at least 5% weight loss through an intensive lifestyle program is recommended, together with a healthy dietary pattern such as Mediterranean, Nordic or vegetarian.
    locator: Prevention section
    population: Adults with overweight/obesity or at risk
    grade: High; Moderate
  - claim: Several diet types and macronutrient mixes work for weight loss; formula meal replacements can be used; neither extreme high-carbohydrate nor very-low-carbohydrate ketogenic diets are recommended; remission (A1C under 6.5% off medication) is achievable with sustained weight loss.
    locator: Energy balance and weight management section
    population: Diabetes with overweight/obesity
    grade: High/Moderate
  - claim: Fiber at least 35 g a day from whole grains, vegetables, legumes, nuts, seeds and whole fruit; low glycemic index/load diets acceptable; free sugars under 10% of energy; non-nutritive sweeteners can replace sugars.
    locator: Carbohydrate section
    population: Adults with diabetes
    grade: Moderate-High
  - claim: Fats should be mainly plant mono- and polyunsaturated; saturated fat under 10% and trans fat under 1% of energy, replacing saturated fat mainly with plant unsaturated fats.
    locator: Dietary fat section
    population: null
    grade: Low
  - claim: Protein recommendations are conditional on age, kidney function, weight status and whether the diet is for weight loss - 10-20% of energy (15-20% at 65 or older), 23-32% within weight-loss diets, and 10-15% with moderate diabetic kidney disease; each figure applies only to its stated group (see notes).
    locator: Protein section
    population: Different for each figure; see notes
    grade: Low
  - claim: Recommended foods and patterns emphasize minimally processed whole grains, vegetables, fruit, legumes, nuts and seeds; red and processed meat, sugar-sweetened beverages, sweets and refined grains should be minimized; fruit juice benefit is limited to about 150 ml; fried potatoes are associated with diabetes; ultra-processed food evidence is observational; no level of alcohol is recommended.
    locator: Food-based approaches and dietary patterns sections
    population: null
    grade: Moderate (foods); commentary (others)
limitations: Industry ties of authors and funders noted above.
reviewer_read: false
notes: >-
  Second-pass review (PR #5, Copilot) says the 10-20% figure is for weight-stable, normal-weight people with
  diabetes and the 23-32% figure for people with type 2 diabetes, overweight or obesity and eGFR above 60, for
  up to 12 months. The full text could not be re-opened on 2026-11-26 (publisher site blocked; repository
  records give the abstract only), so these conditions are not yet verified here. Re-read the protein section
  before any topic relies on this finding. Sodium wording corrected against the abstract (University of
  Adelaide repository record, opened 2026-11-26).
