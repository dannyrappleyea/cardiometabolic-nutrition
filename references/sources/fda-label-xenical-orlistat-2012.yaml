findings:
- claim: Taken with each main meal containing fat (skip the dose if a meal is missed or has no fat), alongside a reduced-calorie diet with about 30% of calories from fat spread over three meals.
  locator: §2.1; §17.5
  population: null
  grade: null
- claim: A daily multivitamin with vitamins A, D, E, K and beta-carotene should be taken at least 2 hours before or after the dose; vitamin K absorption may fall, which matters for people on warfarin.
  locator: §2.1; §5.1; §7.4
  population: null
  grade: null
- claim: Oily spotting, urgency and fatty stools are common and more likely with high-fat meals; urinary oxalate may rise, with oxalate kidney stones reported; rare severe liver injury has been reported.
  locator: §5.2-5.5; §6.1-6.2
  population: null
  grade: null
- claim: Separate levothyroxine by at least 4 hours and cyclosporine by 3 hours.
  locator: §7.1; §7.3
  population: null
  grade: null
