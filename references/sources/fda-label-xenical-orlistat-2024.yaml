findings:
  - claim: Taken as one capsule with each main meal containing fat (during or up to an hour after); the diet should supply about 30% of calories from fat with fat, carbohydrate and protein spread over three meals, and a dose can be skipped if a meal is missed or has no fat.
    locator: §1; §2
    population: Adults with BMI 30 or more, or 27 or more with risk factors
    grade: null
  - claim: Absorption of fat-soluble vitamins and beta-carotene falls, so a multivitamin is advised, taken at least 2 hours before or after a dose (for example at bedtime); gastrointestinal effects rise when the diet exceeds about 30% fat, especially with a very high-fat meal.
    locator: §2; §5
    population: null
    grade: null
  - claim: Warnings include oxalate kidney stones and oxalate nephropathy with kidney failure (monitor kidney function in people at risk), gallstones with substantial weight loss, and rare severe liver injury.
    locator: §5 (incl. §5.3, revised 11/2022); §6.2
    population: null
    grade: null
  - claim: Separate levothyroxine by at least 4 hours and give cyclosporine 3 hours after; reduced vitamin K absorption calls for close coagulation monitoring with warfarin; reduced amiodarone exposure, seizures with antiepileptics and loss of HIV control with antiretrovirals have been reported.
    locator: §7
    population: null
    grade: null
limitations: Not the newest approved text - S-039 (2026-09-30) was approved after this SPL version. The S-039 letter does not list §2 dosing among the changes, but topic research must open the S-039 labeling before relying on this record.
