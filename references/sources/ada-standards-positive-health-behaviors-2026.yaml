findings:
  - claim: People with prediabetes or diabetes and overweight should have a weight plan aiming for at least 5-7% loss; at least 5% is needed for metabolic benefit in type 2 diabetes and up to 15% may be appropriate.
    locator: Rec 5.12; Nutrition Therapy text (weight)
    population: Prediabetes or type 2 diabetes with overweight/obesity
    grade: A
  - claim: Eating plans should emphasize non-starchy vegetables, whole fruit, legumes, lean protein, whole grains, nuts and seeds and low-fat or non-dairy alternatives, and minimize red meat, sugary drinks, sweets, refined grains and processed and ultra-processed foods; no single eating pattern is ideal, with Mediterranean, DASH, low-fat, carbohydrate-restricted, vegetarian and vegan patterns all listed.
    locator: Rec 5.14; Nutrition Therapy text (eating patterns)
    population: null
    grade: B
  - claim: Reducing overall carbohydrate may be considered for some adults; very-low-carbohydrate plans improve A1C in the short term with smaller differences after a year, and ketogenic eating should be discouraged with SGLT2 inhibitors because of ketoacidosis risk.
    locator: Recs 5.15, 5.26; text (carbohydrate)
    population: Adults with diabetes
    grade: B; E
  - claim: Recommendations also cover fiber (at least 14 g per 1,000 kcal from minimally processed carbohydrate), sodium under 2,300 mg a day, water in place of other drinks, replacing sugar-sweetened beverages, non-nutritive sweeteners in moderation, more plant protein, a Mediterranean-style pattern, and limiting foods high in saturated fat.
    locator: Recs 5.20-5.22, 5.24, 5.25, 5.29-5.31
    population: null
    grade: A or B as listed
  - claim: Supplements are not recommended for glycemic benefit without deficiency; beta-carotene supplementation should be avoided; periodic vitamin B12 testing should be considered with metformin; protein and micronutrient intake should be monitored during intentional weight loss.
    locator: Recs 5.16, 5.17, 5.23; text (micronutrients)
    population: null
    grade: C, B, E
  - claim: Adults who drink should stay within daily limits and non-drinkers should not start; the text says there is no known safe amount of alcohol and warns of delayed hypoglycemia for people on insulin or secretagogues.
    locator: Recs 5.18-5.19; text (alcohol)
    population: null
    grade: B
  - claim: Intermittent fasting and time-restricted eating produce mild to moderate weight loss over 8-12 weeks but are not better than continuous calorie restriction; evidence on meal timing (chrononutrition) is inconclusive.
    locator: Text (meal timing)
    population: null
    grade: null
  - claim: Protein intakes above or below 0.8-1.5 g/kg/day are not shown to improve outcomes, and intake below 0.8 g/kg/day is not recommended.
    locator: Text (protein)
    population: Adults with diabetes
    grade: null
limitations: Only the nutrition part was read.
