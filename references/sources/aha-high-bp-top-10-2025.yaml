findings:
  - claim: Lists adult blood pressure categories as normal (under 120 and under 80), elevated (120-129 and under 80), stage 1 (130-139 or 80-89), stage 2 (140+ or 90+), severe hypertension (over 180 and/or over 120, no symptoms) and hypertensive emergency (same numbers with symptoms such as chest pain or vision change).
    locator: Blood pressure categories table
    population: Non-pregnant adults
    grade: null
  - claim: Pregnancy uses different categories (hypertension at 140/90 or higher; severe at 160/110 or higher).
    locator: Pregnancy categories
    population: Pregnant people
    grade: null
  - claim: Lifestyle advice on the page covers sodium (aim for 2,300 mg a day or less, ideally under 1,500 mg), a DASH-style eating pattern, drinking less or no alcohol, and losing about 5% of body weight; it links to a separate potassium page without giving a number.
    locator: Lifestyle section
    population: Adults with or at risk of high blood pressure
    grade: null
limitations: Patient-facing summary; no grades; does not state the guideline year explicitly.
