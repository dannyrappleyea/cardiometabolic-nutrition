findings:
  - claim: WHO conditionally recommends against using non-sugar sweeteners to control body weight or reduce noncommunicable disease risk, citing no long-term benefit for body fat and possible long-term associations with type 2 diabetes, cardiovascular disease and death.
    locator: News release
    population: Everyone except people with pre-existing diabetes
    grade: Conditional
  - claim: The recommendation covers synthetic and natural non-nutritive sweeteners such as aspartame, sucralose and stevia, but not low-calorie sugars or sugar alcohols.
    locator: News release
    population: null
    grade: null
limitations: Known through WHO's own release; guideline text not read. Population limit matters - ADA and EASD (written for people with diabetes) allow sweeteners as sugar replacements, which is not a direct contradiction.
