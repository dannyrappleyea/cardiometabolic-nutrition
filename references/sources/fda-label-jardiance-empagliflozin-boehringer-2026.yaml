findings:
  - claim: Taken once daily in the morning with or without food; it should be withheld at least 3 days before surgery or procedures needing prolonged fasting where possible, and restarted once the person is stable and eating.
    locator: §2
    population: null
    grade: null
  - claim: Ketoacidosis can occur even without marked high glucose; precipitating factors include reduced caloric intake, ketogenic diet, surgery, acute illness, volume depletion and alcohol abuse.
    locator: §5.1
    population: null
    grade: null
  - claim: Can cause volume depletion and low blood pressure, more so with eGFR under 60, in older adults and with loop diuretics; urinary and genital infections are more common; urine glucose tests turn positive and should not be used for monitoring; hypoglycemia risk rises with insulin or secretagogues.
    locator: §5.2; §5.3; §7
    population: null
    grade: null
limitations: §12.3 (food effect) and §17 not read in this version; the repackager copy recorded earlier reported a modest, clinically unimportant high-fat meal effect.
