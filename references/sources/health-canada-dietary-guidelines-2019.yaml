findings:
  - claim: Vegetables, fruit, whole grains and protein foods should be eaten regularly, with plant-based protein foods more often; foods high in saturated fat should be replaced with foods high in unsaturated fat; water is the drink of choice.
    locator: Guideline 1 (Section 1)
    population: Ages 2 and over
    grade: null
  - claim: Highly processed foods and drinks high in sodium, free sugars or saturated fat should not be consumed regularly, with limits of sodium under 2,300 mg a day (age 14+), free sugars under 10% of energy and saturated fat under 10% of energy.
    locator: Guideline 2 (Section 2)
    population: null
    grade: null
  - claim: Sugary drinks (including 100% fruit juice and sweetened plant beverages) should not be consumed regularly; sugar substitutes are not needed and have no well-established health benefit; alcohol carries risks including cancer and non-drinkers should not be encouraged to start.
    locator: Section 2 considerations
    population: null
    grade: null
  - claim: Cooking with nutritious foods and using food labels (Nutrition Facts table, ingredient list) are promoted as food skills; meals from restaurants and other outlets tend to be higher in calories, sodium, sugars and saturated fat.
    locator: Guideline 3 (Section 3)
    population: null
    grade: null
limitations: Population-wide guidance, not specific to cardiometabolic conditions.
