findings:
- claim: Eating patterns should emphasize nonstarchy vegetables, whole fruits, legumes, lean proteins, whole grains,
    nuts and seeds and low-fat or nondairy options, and minimize red meat, sugar-sweetened beverages, sweets, refined
    grains and processed or ultraprocessed foods.
  locator: Recommendation 5.14
  population: Prediabetes and diabetes
  grade: B
- claim: Reducing overall carbohydrate intake, mainly by limiting processed foods, can be considered for some adults
    to improve glycemia; very-low-carbohydrate plans improved A1C short term but the advantage faded beyond a year.
  locator: Recommendation 5.15; carbohydrate text
  population: null
  grade: B
- claim: Carbohydrate should come mostly from minimally processed, high-fiber foods, with at least 14 g fiber per
    1,000 kcal.
  locator: Recommendation 5.24
  population: null
  grade: B
- claim: Sodium should be limited to under 2,300 mg/day when clinically appropriate, mainly by cutting processed
    foods.
  locator: Recommendation 5.20
  population: null
  grade: B
- claim: People with overweight or obesity should get a nutrition, activity and behavior plan targeting at least
    5-7% weight loss; protein sufficiency and micronutrient status should be monitored during intentional weight
    loss.
  locator: Recommendations 5.12, 5.23
  population: null
  grade: A; E
- claim: Non-nutritive sweeteners may replace sugar in moderation and short term; water is preferred over other
    beverages; sugar-sweetened beverages including juice should be replaced.
  locator: Recommendations 5.21, 5.22, 5.25
  population: null
  grade: A; B; B
- claim: People at risk of ketoacidosis on SGLT2 inhibitors should be educated, given ketone testing tools and discouraged
    from ketogenic eating.
  locator: Recommendation 5.26
  population: null
  grade: E
- claim: Micronutrient and herbal supplements such as magnesium, chromium and cinnamon are not recommended for glycemic
    benefit; beta-carotene supplements are advised against; vitamin B12 should be checked periodically on metformin.
  locator: Recommendations 5.16, 5.17; metformin text
  population: null
  grade: C; B
- claim: Adults who drink should stay within recommended daily limits (text cites up to 2 drinks/day for men and
    1 for women) and non-drinkers should not start.
  locator: Recommendation 5.18; alcohol text
  population: null
  grade: B
- claim: Plant-based proteins and a Mediterranean-style pattern are favored to reduce cardiovascular risk, and foods
    high in saturated fat should be limited. Protein intake is individualized at about 0.8-1.5 g/kg/day.
  locator: Recommendations 5.29-5.31; protein text
  population: null
  grade: B; A/B; B
- claim: Intermittent fasting and time-restricted eating gave weight loss similar to continuous calorie restriction;
    religious fasting should be risk-assessed with the IDF-DAR score.
  locator: Meal timing text; Recommendations 5.32-5.33
  population: null
  grade: null
