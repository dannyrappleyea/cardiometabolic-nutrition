findings:
- claim: The pattern favors vegetables, fruit and wholegrains; plant proteins and fish; smaller amounts of eggs
    and lean poultry; lean red meat limited to 1-3 times a week; fish 2-3 times a week.
  locator: Steps 1, 2 and 4
  population: null
  grade: null
- claim: People with heart disease or high cholesterol should choose reduced-fat milk, yoghurt and cheese; others
    may choose reduced- or full-fat unflavoured dairy.
  locator: Step 3
  population: null
  grade: null
- claim: Most people need not limit eggs, but people with heart disease, high LDL or type 2 diabetes are advised
    to keep to 7 eggs a week or fewer.
  locator: Eggs
  population: null
  grade: null
- claim: Salt intake should stay below 5 g/day; ultra-processed foods (up to 40% of the average Australian diet)
    should be eaten only sometimes; water is the preferred drink and alcohol is not recommended for heart health.
  locator: Step 5; processed foods; drinks
  population: null
  grade: null
