# Scope threshold check — produced by playbooks/01-discover.md step 1.
# One row per threshold in SCOPE.md §3–5, exactly as SCOPE states it. Schema: schemas/scope-check.schema.json.
# Categorical items (conditions with no number) are listed too, so every line of §3–5 has a row.
checked: "2026-11-24"
by: Claude Opus 5.5 (claude-opus-5-5)
thresholds:
  # ---------------- §3 Inclusion ----------------
  - ref: "§3 Age"
    threshold: "40–75 years. Adult, not pregnant or breastfeeding."
    status: unverified
    sources: [ada-standards-cvd-risk-management-2026, nice-type-2-diabetes-prevention-ph38-2017]
    proposed: null
    note: >-
      A cohort-design choice, not a guideline-defined threshold. Related bands seen: ADA statin recommendations for
      adults 40-75 (Recs 10.18-10.20); NICE PH38 risk assessment from age 40 (25 for some ethnic groups) and says age
      alone should not exclude people over 75; the 2026 ACC/AHA dyslipidemia guideline's PREVENT equations cover 30-79
      (known only from summaries). None of these defines a diet-research boundary, so no change is proposed.
  - ref: "§3 Domain rule"
    threshold: "At least two of the following three domains, or one domain plus overweight/obesity"
    status: unverified
    sources: []
    proposed: null
    note: Cohort-design rule; no guideline defines it. Not checkable.
  - ref: "§3 Blood pressure"
    threshold: "Elevated through stage 2: systolic 120–179 and/or diastolic 80–119 mmHg (office or home average), treated or untreated"
    status: disagrees
    sources: [aha-high-bp-top-10-2025, esc-elevated-bp-hypertension-guideline-2024, ada-standards-cvd-risk-management-2026]
    proposed: >-
      Keep the range but name its basis: "systolic 120–179 and/or diastolic 80–119 mmHg (ACC/AHA 2025 categories:
      elevated 120–129/<80, stage 1 130–139 or 80–89, stage 2 ≥140 or ≥90). Under ESC 2024 'elevated BP' is
      120–139/70–89, so people with systolic <120 and diastolic 70–79 are 'elevated' in Europe but not core here."
    note: >-
      The systolic lower bound (120) and the hypertension cut-offs (US 130/80; ESC and NICE-style 140/90) are
      confirmed: ESC 2024 full text §2 and §8.4; ADA 2026 Rec 10.1 (diabetes uses 130/80). The ACC/AHA 2025 categories
      come from AHA's own public summary page; the guideline full text could not be opened (publisher refused), so the
      US side rests on the issuing body's summary. The disagreement is only the diastolic lower bound (ESC 70 vs SCOPE 80).
  - ref: "§3 Glycemia"
    threshold: "Prediabetes (A1C 5.7–6.4%, or the fasting/OGTT equivalent)"
    status: verified
    sources: [ada-standards-diagnosis-classification-2026, nice-type-2-diabetes-prevention-ph38-2017]
    proposed: null
    note: >-
      ADA 2026 Table 2.2: A1C 5.7-6.4%, fasting glucose 100-125 mg/dL, 2-h OGTT 140-199 mg/dL. Non-US difference for
      the reviewer: NICE PH38 defines high risk as HbA1c 42-47 mmol/mol (6.0-6.4%) or fasting glucose 5.5-6.9 mmol/L.
      SCOPE follows the ADA definition; no change proposed, but topics should say which definition they use.
  - ref: "§3 Glycemia"
    threshold: "type 2 diabetes with A1C below ~9.0%"
    status: unverified
    sources: [ada-standards-diagnosis-classification-2026]
    proposed: null
    note: >-
      Diabetes itself is verified (A1C ≥6.5%, ADA Table 2.1). No opened source defines 9.0% as a boundary for diet
      advice; ADA §9 (pharmacologic approaches), where A1C-based treatment-intensification thresholds would sit, was
      not opened, and a drug-intensification threshold would serve a different purpose anyway.
  - ref: "§3 Glycemia notes"
    threshold: "Not using insulin or medicines that commonly cause hypoglycemia (see §5)"
    status: verified
    sources: [ada-standards-positive-health-behaviors-2026, fda-label-jardiance-empagliflozin-2026, fda-label-januvia-sitagliptin-2023, fda-label-glucophage-metformin-2018]
    proposed: null
    note: >-
      ADA Recs 5.19 and 5.27-5.28 give insulin/secretagogue users distinct advice (delayed hypoglycemia after alcohol,
      carbohydrate counting, consistent carbohydrate with fixed insulin); several labels say hypoglycemia risk rises
      when combined with insulin or sulfonylureas.
  - ref: "§3 Lipids"
    threshold: "LDL-C 100–189 mg/dL"
    status: unverified
    sources: [esc-eas-dyslipidaemias-guideline-2019, aha-acc-dyslipidemia-guideline-2026]
    proposed: null
    note: >-
      Upper bound consistent with severe hypercholesterolemia starting at 190 mg/dL (4.9 mmol/L) in ESC/EAS 2019. No
      opened source defines LDL-C ≥100 mg/dL as a dyslipidemia diagnosis: 100 mg/dL appears as a treatment goal
      (ESC/EAS moderate risk <2.6 mmol/L; ACC/AHA 2026 borderline/intermediate risk <100, via summary), which is a
      different purpose. The 2026 ACC/AHA full text, which may define categories, could not be opened.
  - ref: "§3 Lipids"
    threshold: "triglycerides 150–499 mg/dL"
    status: verified
    sources: [ada-standards-cvd-risk-management-2026, esc-eas-dyslipidaemias-guideline-2019, fda-label-vascepa-icosapent-ethyl-2019]
    proposed: null
    note: >-
      ADA Recs 10.15/10.30: fasting TG ≥150 mg/dL (non-fasting >175) is hypertriglyceridemia; ≥500 handled separately
      (Rec 10.29). ESC/EAS 2019: fasting TG >1.7 mmol/L (150 mg/dL) raises risk and uses a 135-499 mg/dL band for
      icosapent ethyl. Topics should note the non-fasting 175 mg/dL cut-off.
  - ref: "§3 Lipids"
    threshold: "non-HDL-C ≥130 mg/dL"
    status: unverified
    sources: []
    proposed: null
    note: No opened source gives a non-HDL-C threshold. The 2026 ACC/AHA guideline reinstates non-HDL-C goals (per its summaries) but numbers were not seen.
  - ref: "§3 Lipids"
    threshold: "low HDL-C"
    status: verified
    sources: [ada-standards-cvd-risk-management-2026]
    proposed: null
    note: SCOPE gives no number. ADA Rec 10.15 uses <40 mg/dL (men) and <50 mg/dL (women); the reviewer may wish to add these to SCOPE (not a disagreement).
  - ref: "§3 Lipids notes"
    threshold: "Treated or untreated. Includes mixed dyslipidemia"
    status: unverified
    sources: []
    proposed: null
    note: Definitional; nothing to verify.
  - ref: "§3 Body size"
    threshold: "BMI 25–39.9 kg/m²"
    status: verified
    sources: [nice-overweight-obesity-management-ng246-2025, ada-standards-diagnosis-classification-2026]
    proposed: null
    note: NICE NG246 Rec 1.9.10 - overweight 25-29.9, obesity class 1 30-34.9, class 2 35-39.9, class 3 ≥40.
  - ref: "§3 Body size"
    threshold: "(or the lower thresholds used for people of Asian ancestry)"
    status: disagrees
    sources: [nice-overweight-obesity-management-ng246-2025, nice-type-2-diabetes-prevention-ph38-2017, easl-easd-easo-masld-guideline-2024, ada-standards-diagnosis-classification-2026]
    proposed: >-
      Name the thresholds and groups, e.g. "or BMI 23–37.4 for people of South Asian, Chinese, other Asian, Middle
      Eastern, Black African or African-Caribbean family background (NICE NG246 Rec 1.9.11)", and state which source a
      topic uses where they differ.
    note: >-
      Lower thresholds differ in both cut-off and the groups covered. NICE NG246 applies overweight 23-27.4 and obesity
      ≥27.5 (classes 2.5 lower) to South Asian, Chinese, other Asian, Middle Eastern, Black African and African-Caribbean
      backgrounds; EASL-EASD-EASO 2024 uses overweight 23-24.9 and obesity ≥25 for Asian people; ADA 2026 uses ≥23 for
      diabetes screening in Asian Americans (a different purpose). SCOPE's wording covers only "Asian ancestry".
  - ref: "§3 Body size"
    threshold: "or a waist above the sex-specific cut-off"
    status: verified
    sources: [esc-elevated-bp-hypertension-guideline-2024, nice-overweight-obesity-management-ng246-2025]
    proposed: null
    note: >-
      ESC 2024 Rec Table 15 uses waist <94 cm (men) and <80 cm (women) as targets. For the reviewer: NICE NG246 uses a
      waist-to-height ratio (≥0.5 increased, ≥0.6 high) instead of sex-specific waist cut-offs; SCOPE could allow either.
      The harmonized metabolic-syndrome waist definitions were not opened.
  - ref: "§3 Body size"
    threshold: "Normal-weight people meeting the domain rule are also core."
    status: unverified
    sources: []
    proposed: null
    note: Cohort-design rule; nothing to verify.
  - ref: "§3 Kidneys"
    threshold: "eGFR ≥60 and UACR <30 mg/g, or not yet tested"
    status: verified
    sources: [kdigo-ckd-guideline-2024]
    proposed: null
    note: KDIGO 2024 Tables 1-3 - CKD is eGFR <60 or ACR ≥30 mg/g for >3 months; G1-G2 ≥60 and A1 <30 mg/g define the no-CKD range. ACC/AHA 2025 now recommends UACR testing for everyone with high blood pressure (via journal scan), which supports SCOPE's "find out" step.
  - ref: "§3 Medications"
    threshold: "any combination of medicines commonly prescribed for these conditions, except those in §5"
    status: unverified
    sources: []
    proposed: null
    note: Definitional; classes are enumerated in coverage.yaml (medication_classes).
  # ---------------- §4 Adjacent flags ----------------
  - ref: "§4 Age"
    threshold: "Age 30–39 or 76–79."
    status: unverified
    sources: []
    proposed: null
    note: Cohort-design bands; no guideline defines them. (PREVENT risk equations cover 30-79 per ACC/AHA summaries, which may be why these bands were chosen.)
  - ref: "§4 BMI"
    threshold: "BMI ≥40."
    status: verified
    sources: [nice-overweight-obesity-management-ng246-2025]
    proposed: null
    note: NICE obesity class 3 is BMI ≥40, but ≥37.5 for the ethnic groups in Rec 1.9.11 (see the "lower thresholds" row).
  - ref: "§4 Kidneys"
    threshold: "eGFR 45–59, or UACR 30–300 mg/g."
    status: verified
    sources: [kdigo-ckd-guideline-2024]
    proposed: null
    note: KDIGO G3a (45-59) and A2 (30-300 mg/g).
  - ref: "§4 Glycemia"
    threshold: "Type 2 diabetes with A1C 9.0% or higher."
    status: unverified
    sources: []
    proposed: null
    note: See the §3 "A1C below ~9.0%" row.
  - ref: "§4 Lipids"
    threshold: "LDL-C ≥190 mg/dL or suspected familial hypercholesterolemia."
    status: verified
    sources: [esc-eas-dyslipidaemias-guideline-2019]
    proposed: null
    note: ESC/EAS 2019 risk categories treat LDL-C >4.9 mmol/L (190 mg/dL) and FH as at least high risk. FH diagnostic criteria were not in the parts read.
  - ref: "§4 Established CVD"
    threshold: "Established cardiovascular disease (prior heart attack, stroke, revascularization, peripheral artery disease): secondary prevention, where targets usually differ."
    status: verified
    sources: [ada-standards-cvd-risk-management-2026, esc-eas-dyslipidaemias-guideline-2019, acc-dyslipidemia-guideline-journal-scan-2026]
    proposed: null
    note: ADA 2026 defines ASCVD as ACS, MI, angina, coronary or other revascularization, stroke or PAD (incl. aortic aneurysm); LDL-C goals are lower in secondary prevention (<55 mg/dL in ESC/EAS 2019 and ADA Rec 10.27).
  - ref: "§4 Resistant hypertension"
    threshold: "Resistant hypertension (above goal on three or more drug classes)."
    status: disagrees
    sources: [esc-elevated-bp-hypertension-guideline-2024, ada-standards-cvd-risk-management-2026]
    proposed: "Resistant hypertension (above goal despite three or more drug classes at maximally tolerated doses, one of which is a diuretic)."
    note: ESC 2024 §9.13.1 and Table 11 require one of the three to be a diuretic at maximally tolerated doses. The ACC/AHA 2025 definition was not seen (full text not opened).
  - ref: "§4 Liver"
    threshold: "Fatty liver disease without cirrhosis."
    status: verified
    sources: [easl-easd-easo-masld-guideline-2024]
    proposed: null
    note: Current nomenclature is metabolic dysfunction-associated steatotic liver disease (MASLD) - steatosis plus ≥1 cardiometabolic risk factor without harmful alcohol intake. A wording update ("MASLD without cirrhosis") could be considered; not a threshold disagreement.
  - ref: "§4 Gout, stones"
    threshold: "Gout, or kidney stones."
    status: unverified
    sources: [acr-gout-guideline-2020, ahs-nutrition-guideline-kidney-stones-2024]
    proposed: null
    note: Categorical flag. ACR 2020 (via summary) and a provincial stone nutrition guideline show diet advice differs for these groups; the 2026 AUA stone guideline could not be used.
  - ref: "§4 Dietary constraints"
    threshold: "Food allergies, celiac disease, or religious, cultural or ethical dietary rules: handled through the personal profile, not by the research."
    status: unverified
    sources: []
    proposed: null
    note: Process rule; nothing to verify. ADA 2026 Recs 5.32-5.33 cover religious fasting, which a topic may need to reference as a safety point.
  # ---------------- §5 Exclusions ----------------
  - ref: "§5 Age, pregnancy"
    threshold: "Under 18, pregnant, breastfeeding, or planning pregnancy."
    status: unverified
    sources: [fda-label-lipitor-atorvastatin-2024, fda-label-zestril-lisinopril-2025]
    proposed: null
    note: Categorical. Supporting context only - statin and ACE-inhibitor labels advise stopping when pregnancy is recognized, and the ESC/AHA pages use separate pregnancy BP categories.
  - ref: "§5 Diabetes type and treatment"
    threshold: "Type 1 diabetes, LADA, or any diabetes treated with insulin, sulfonylureas or meglitinides (hypoglycemia risk changes the dietary advice)."
    status: verified
    sources: [ada-standards-positive-health-behaviors-2026, fda-label-zepbound-tirzepatide-2026, fda-label-actos-pioglitazone-2025]
    proposed: null
    note: Rationale confirmed (ADA Recs 5.19, 5.27-5.28; labels report higher hypoglycemia rates with sulfonylureas or insulin). LADA and meglitinides are not named in the parts read.
  - ref: "§5 Triglycerides"
    threshold: "Triglycerides ≥500 mg/dL (a distinct dietary approach applies)."
    status: verified
    sources: [ada-standards-cvd-risk-management-2026, fda-label-tricor-fenofibrate-2025, fda-label-vascepa-icosapent-ethyl-2019, acc-dyslipidemia-guideline-journal-scan-2026]
    proposed: null
    note: >-
      ADA Rec 10.29 and the fenofibrate and icosapent ethyl labels use ≥500 mg/dL for severe hypertriglyceridemia; ADA
      text mentions fat reduction for >1,000. For the reviewer: the 2026 ACC/AHA guideline (via summary) emphasizes
      ≥1,000 mg/dL for pancreatitis-prevention therapy. The "distinct dietary approach" itself was not described in
      detail by any opened source.
  - ref: "§5 Kidneys"
    threshold: "eGFR <45, dialysis, or kidney transplant."
    status: verified
    sources: [kdigo-ckd-guideline-2024]
    proposed: null
    note: Matches the KDIGO G3a/G3b boundary (45). EASD 2023 protein advice also changes at eGFR 45-60.
  - ref: "§5 Other conditions"
    threshold: "Heart failure, cirrhosis, or active cancer treatment."
    status: unverified
    sources: [fda-label-aldactone-spironolactone-2025, fda-label-actos-pioglitazone-2025, easl-easd-easo-masld-guideline-2024]
    proposed: null
    note: Categorical. Context - spironolactone and pioglitazone labels and the MASLD guideline give different advice in heart failure and cirrhosis.
  - ref: "§5 Eating disorder"
    threshold: "Current or past eating disorder."
    status: unverified
    sources: [nice-overweight-obesity-management-ng246-2025]
    proposed: null
    note: Categorical. NICE NG246 Rec 1.16.12 requires eating-disorder assessment before low- or very-low-energy diets, consistent with the exclusion.
  - ref: "§5 Surgery"
    threshold: "Bariatric surgery."
    status: unverified
    sources: []
    proposed: null
    note: Categorical; not checked.
  - ref: "§5 Blood pressure"
    threshold: "Hypertensive crisis (≥180/120 mmHg) at any time without a clinician's plan."
    status: disagrees
    sources: [aha-high-bp-top-10-2025, esc-elevated-bp-hypertension-guideline-2024]
    proposed: >-
      "Severe hypertension (systolic above 180 and/or diastolic above 120 mmHg; a hypertensive emergency if symptoms
      or organ damage) at any time without a clinician's plan", citing ACC/AHA 2025; note ESC 2024 defines a
      hypertensive emergency at ≥180/110 with acute organ damage.
    note: >-
      AHA's 2025 summary uses "severe hypertension" and "hypertensive emergency" (>180 and/or >120) rather than
      "crisis"; ESC uses ≥180/110 for emergencies. The US numbers come from the issuing body's summary page because the
      guideline full text could not be opened, so this proposal should be confirmed against the full text.
