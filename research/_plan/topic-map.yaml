topics:
  # ---------------- Foundations ----------------
  - id: targets-clinical-goals
    title: The numbers diet is trying to move, and how to measure them
    kind: targets
    priority: 1
    safety: false
    status: proposed
    questions:
      - Which blood pressure, A1C, LDL-C, non-HDL-C, triglyceride and body-size categories and goals do current US and non-US guidelines set for this cohort, and where do they differ?
      - How do the newer US risk tools (PREVENT) and European tools (SCORE2) change which goal applies to a person in primary prevention?
      - Roughly how much can diet and weight change alone move each number, according to the guidelines' own effect estimates?
      - How should home blood pressure, A1C and lipid results be measured and interpreted (fasting vs non-fasting lipids, A1C limitations) when judging whether diet is working?
      - How long after a diet change should each number be rechecked?
      - Which numbers (for example kidney function, potassium, vitamin B12) need monitoring because of medicines the cohort commonly takes?
    rationale: >-
      Every other topic needs a shared statement of targets. Opened guidelines set categories and goals that differ by
      jurisdiction and population: BP categories and targets (D5, D9, D14), prediabetes and diabetes criteria with A1C
      limitations (D11, D100), LDL-C/non-HDL-C goals reinstated in the 2026 US guideline and ESC goals (D18, D22), BMI and
      waist-to-height cut-offs (D26), and CKD staging (D28). ESC and ESC/EAS give effect sizes for diet levers (D9 weight
      and BP; D22 Table 8 for lipids). Labels require potassium and B12 monitoring (D50, D56). The US 2025 BP guideline
      full text could not be opened (D2), so this topic must retry it.
    discovered_via: [D2, D5, D9, D11, D14, D18, D22, D26, D28, D50, D56, D100]
    depends_on: []
    watch: true
  - id: pattern-overall-eating-pattern
    title: Which overall eating pattern fits blood pressure, glucose and lipids together
    kind: pattern
    priority: 1
    safety: false
    status: proposed
    questions:
      - Which named eating patterns (DASH, Mediterranean, Nordic, vegetarian or vegan, Portfolio, low-fat) have trial evidence for blood pressure, glycemia and lipids in this cohort, and how large are the effects?
      - What core features do the patterns recommended by the opened guidelines share, and where do they diverge?
      - How much do fruit and vegetables (including potatoes and juice) contribute, and what amounts do guidelines name?
      - Does adopting a pattern add benefit on top of weight loss and sodium reduction?
      - How do the patterns compare for people who also have prediabetes or type 2 diabetes versus those who do not?
      - What evidence exists on hard outcomes (heart attack, stroke, diabetes onset) rather than risk-factor changes?
    rationale: >-
      Every domain guideline opened recommends an overall pattern rather than single foods: ESC names Mediterranean or
      DASH for blood pressure (D9) and ESC/EAS gives a food-choice table for lipids (D22); ADA lists several acceptable
      patterns and a Mediterranean-style pattern (D13, D14); EASD grades Mediterranean, Nordic and vegetarian patterns
      and declines to recommend DASH and Portfolio specifically (D30); AHA's statement lists ten features (D81); MASLD
      guidance favors a Mediterranean-like pattern (D83); Canada and the Heart Foundation describe whole-food patterns (D37, D96).
    discovered_via: [D9, D13, D14, D22, D30, D37, D81, D83, D96]
    depends_on: [targets-clinical-goals]
    watch: false
  - id: weight-loss-and-maintenance
    title: Losing weight and keeping it off through diet
    kind: other
    priority: 1
    safety: false
    status: proposed
    questions:
      - How much weight loss (percentage) do guidelines target for blood pressure, prediabetes, type 2 diabetes, lipids and fatty liver, and what does each amount achieve?
      - Which dietary approaches to an energy deficit (calorie targets, low-fat, lower-carbohydrate, meal replacements) are supported, and do they differ in results?
      - When are low-energy (800-1,200 kcal) or very-low-energy diets and total diet replacement appropriate, for how long, and with what supervision?
      - What helps maintain weight loss over years, and what happens to the numbers when weight is regained?
      - Can type 2 diabetes remission through weight loss apply to this cohort, and how is it defined?
      - What changes when weight loss is achieved with medicines instead of diet alone?
    rationale: >-
      Weight loss targets appear in every domain: ADA ≥5-7% (D13), ESC 5-10% with 4.4/3.6 mmHg per 5 kg (D9), ESC/EAS
      lipid effects (D22), EASD ≥5% for prevention, meal replacements and remission (D30), NICE limits on low- and
      very-low-energy diets (D26) and 5-10% in prevention programmes (D100), MASLD 5/7-10/≥10% (D83). The tirzepatide label
      shows regain after withdrawal (D61). Scope boundary: bariatric surgery and eating disorders are excluded (SCOPE §5);
      NICE requires eating-disorder screening before restrictive diets (D26).
    discovered_via: [D9, D13, D22, D26, D30, D61, D83, D100]
    depends_on: [targets-clinical-goals]
    watch: false
  - id: nutrient-sodium
    title: Sodium (salt) - how much, and where it comes from
    kind: nutrient
    priority: 1
    safety: false
    status: proposed
    questions:
      - What daily sodium limits do US, European, WHO and kidney guidelines set (for example 2,300 mg, 2,000 mg, 1,500 mg), and why do they differ?
      - How much does lowering sodium lower blood pressure in people with elevated BP or hypertension, and does the effect continue below 1,500 mg?
      - Is there evidence of harm from very low sodium intake (the J-curve question) relevant to this cohort?
      - Which foods supply most sodium (processed, packaged and restaurant foods), and which practical changes cut the most?
      - Does sodium advice change for people taking diuretics, for older adults, or for people with reduced kidney function?
    rationale: >-
      Sodium limits are named by every BP and kidney source and differ: ESC about 2 g/day with discussion of the J-curve
      and benefit below 1.5 g (D9), AHA ≤2,300 mg ideally <1,500 (D5), ADA <2,300 (D13, D14), KDIGO <2 g (D28), Canada
      <2,300 (D37), NASEM CDRR 2,300 and AI 1,500 (D94), Heart Foundation 5 g salt (D96). Lisinopril's label links salt and
      volume depletion to low blood pressure (D46).
    discovered_via: [D5, D9, D13, D14, D28, D37, D46, D94, D96]
    depends_on: [targets-clinical-goals]
    watch: false
  - id: nutrient-potassium-salt-substitutes
    title: Potassium and potassium-enriched salt substitutes - benefits and who must be careful
    kind: nutrient
    priority: 1
    safety: true
    status: proposed
    questions:
      - How much does raising dietary potassium lower blood pressure, and what intake ranges do guidelines suggest?
      - What did WHO recommend about lower-sodium, potassium-enriched salt substitutes in 2025, for whom, and with what exclusions?
      - Which people do WHO, kidney and hypertension guidelines say should not use potassium-enriched salt substitutes or potassium supplements?
      - At what kidney function or blood potassium levels do guidelines advise caution or monitoring when potassium intake rises?
      - Which foods are the main potassium sources, and how do food sources compare with supplements and salt substitutes for safety?
    rationale: >-
      ESC suggests more potassium (+0.5-1 g/day) except in moderate-to-advanced CKD and asks for potassium monitoring with
      potassium-sparing drugs (D9); WHO issued a 2025 guideline on potassium-enriched salt substitutes with an advisory
      for kidney disease (D39, D40); NASEM set no potassium upper limit and urges caution in reduced kidney function (D94);
      KDIGO gives dietary potassium advice in hyperkalemia (D28); ADA asks for potassium monitoring with ACE inhibitors,
      ARBs and MRAs (D14). Labels for lisinopril, losartan, spironolactone and finerenone warn about potassium supplements
      or salt substitutes (D46, D48, D50, D71). Getting this wrong can cause dangerous hyperkalemia.
    discovered_via: [D9, D14, D28, D39, D40, D46, D48, D50, D71, D94]
    depends_on: [nutrient-sodium]
    watch: true
  - id: pattern-carbohydrate-reduction
    title: Lower-carbohydrate and ketogenic eating - benefits, limits and medicine safety
    kind: pattern
    priority: 1
    safety: true
    status: proposed
    questions:
      - What do trials show for reduced-carbohydrate and very-low-carbohydrate (ketogenic) diets on A1C, weight, triglycerides and LDL-C, in the short and long term?
      - How do guidelines define low- and very-low-carbohydrate intake, and which bodies endorse or advise against each level?
      - Which commonly used medicines (SGLT2 inhibitors in particular) make ketogenic or very-low-calorie eating risky, and what do their labels say?
      - Does the evidence on glycemic index or load add anything once carbohydrate amount and fiber are accounted for?
      - Which groups should not follow very-low-carbohydrate diets according to the guidelines?
    rationale: >-
      ADA suggests reducing carbohydrate for some adults while discouraging ketogenic eating with SGLT2 inhibitors (D13);
      the empagliflozin label lists ketogenic diets, reduced calorie intake and fasting among ketoacidosis triggers (D63);
      EASD advises against very-low-carbohydrate ketogenic diets and accepts low glycemic index diets (D30); ESC/EAS rates
      cutting total carbohydrate as lowering triglycerides (D22); a provincial stone guideline notes ketogenic diets
      affect stone risk (D88). Safety-critical because of euglycemic ketoacidosis on SGLT2 inhibitors.
    discovered_via: [D13, D22, D30, D63, D88]
    depends_on: [pattern-overall-eating-pattern, weight-loss-and-maintenance]
    watch: true
  # ---------------- Nutrients and food groups ----------------
  - id: nutrient-dietary-fats
    title: Dietary fats and cooking oils - saturated, trans and unsaturated fats
    kind: nutrient
    priority: 2
    safety: false
    status: proposed
    questions:
      - How much does replacing saturated fat with unsaturated fat (and with which foods) lower LDL-C and cardiovascular events?
      - What saturated and trans fat limits do the opened guidelines set (for example under 10% or under 7% of energy), and for whom?
      - How do butter, beef tallow, lard and tropical oils (coconut, palm) compare with liquid plant oils such as olive or canola?
      - Why do the 2025-2030 Dietary Guidelines for Americans and US professional societies disagree on animal fats, and what evidence does each side cite?
      - Does total fat intake matter once fat type is accounted for?
    rationale: >-
      ESC/EAS sets saturated fat under 10% (under 7% with high cholesterol) and rates trans-fat avoidance and saturated-fat
      reduction as moderate LDL-lowering levers (D22); EASD grades plant unsaturated fats (low certainty) (D30); AHA favors
      liquid plant oils over tropical oils and animal fats (D81); ADA limits foods high in saturated fat (D13); Canada and
      NICE advise swapping saturated for unsaturated fats (D37, D100). The 2025-2030 US federal guidelines list butter and
      beef tallow as options while keeping a 10% limit, which an ACC work group disputes (D34, D35).
    discovered_via: [D13, D22, D30, D34, D35, D37, D81, D100]
    depends_on: [pattern-overall-eating-pattern]
    watch: true
  - id: foodgroup-whole-grains-fiber
    title: Whole grains, fiber and soluble fiber
    kind: food-group
    priority: 2
    safety: false
    status: proposed
    questions:
      - What fiber intakes do guidelines name (grams per day or per 1,000 kcal), and what evidence links them to glucose, lipids and blood pressure?
      - How much do soluble fibers such as oat and barley beta-glucan lower LDL-C, and at what dose?
      - What counts as a whole-grain food, and how do whole and refined grains differ in effect?
      - When, if ever, are fiber-enriched foods or fiber supplements useful for this cohort?
    rationale: >-
      Fiber targets differ: ADA ≥14 g per 1,000 kcal (D13), EASD ≥35 g/day (D30), ESC/EAS 25-40 g with 7-13 g soluble and
      beta-glucan 3-10 g/day (D22); ADA lists soluble fiber as a lipid lever (D14); AHA, Canada and NICE emphasize whole
      grains (D37, D81, D100).
    discovered_via: [D13, D14, D22, D30, D37, D81, D100]
    depends_on: [pattern-overall-eating-pattern]
    watch: false
  - id: nutrient-sugars-sweetened-drinks
    title: Added and free sugars, sugar-sweetened drinks and fruit juice
    kind: nutrient
    priority: 2
    safety: false
    status: proposed
    questions:
      - What limits on added or free sugars do guidelines set (percentage of energy, grams per meal), and how do they compare?
      - How strongly are sugar-sweetened drinks linked to blood pressure, weight, diabetes and triglycerides?
      - Is 100% fruit juice treated as a sugary drink, and is there an amount guidelines accept?
      - Does fructose in particular raise triglycerides at intakes people commonly reach?
    rationale: >-
      Sugar limits appear across sources: ESC ≤10% free sugar and limiting sugar-sweetened drinks (D9), ESC/EAS <10% added
      sugar with fructose raising triglycerides (D22), EASD <10% and juice about 150 ml (D30), ADA replacing sugary drinks
      (D13), Canada counting 100% juice as a sugary drink (D37), the US federal guidelines' per-meal limit (D34), Heart
      Foundation 125 ml juice (D96), MASLD avoiding sugary drinks (D83).
    discovered_via: [D9, D13, D22, D30, D34, D37, D83, D96]
    depends_on: [pattern-overall-eating-pattern]
    watch: false
  - id: additive-non-nutritive-sweeteners
    title: Non-sugar (low- and no-calorie) sweeteners
    kind: additive
    priority: 2
    safety: false
    status: proposed
    questions:
      - What does each authority say about non-sugar sweeteners, and whom does each recommendation cover (for example, people with or without diabetes)?
      - What evidence underlies WHO's conditional recommendation against them for weight control, and how strong is it?
      - Do sweetened drinks with non-sugar sweeteners help people replace sugary drinks without harming glucose or weight?
      - Do sugar alcohols and newer sweeteners raise any specific concerns relevant to the cohort?
    rationale: >-
      Authorities differ and cover different people: WHO conditionally advises against non-sugar sweeteners for everyone
      except people with diabetes (D90); ADA and EASD accept them as sugar replacements for people with diabetes (D13, D30);
      Canada says they are unnecessary (D37); the 2025-2030 US federal guidelines advise avoiding them (D34); ESC/EAS lists
      non-caloric sweeteners as preferred over sugar (D22). Population limits must be checked before calling this a disagreement.
    discovered_via: [D13, D22, D30, D34, D37, D90]
    depends_on: [nutrient-sugars-sweetened-drinks]
    watch: true
  - id: nutrient-protein-amount
    title: How much protein - general, during weight loss, and with reduced kidney function
    kind: nutrient
    priority: 2
    safety: false
    status: proposed
    questions:
      - What daily protein amounts (grams per kilogram) do the opened guidelines set for adults, older adults and people losing weight?
      - Why did the 2025-2030 US federal guidelines raise their protein target, and what evidence supports or contests it?
      - What upper limits on protein do kidney guidelines set, and at what eGFR do they start to apply?
      - Do higher-protein diets help or harm glucose control, cholesterol or blood pressure compared with usual intakes?
      - How should protein be prioritized to protect muscle during large weight loss?
    rationale: >-
      Protein advice conflicts across sources: ADA finds no benefit outside 0.8-1.5 g/kg (D13), the 2025-2030 US federal
      guidelines set 1.2-1.6 g/kg (D34), which an ACC group notes was not in the advisory committee report (D35), KDIGO
      keeps about 0.8 g/kg in CKD G3-G5 and avoids >1.3 (D28), EASD sets percent-energy ranges by age and eGFR (D30), and
      the GLP-1 nutrition advisory prioritizes muscle preservation (D92).
    discovered_via: [D13, D28, D30, D34, D35, D92]
    depends_on: [weight-loss-and-maintenance]
    watch: true
  - id: foodgroup-protein-foods
    title: Protein foods - legumes, nuts, fish, poultry, eggs, and red and processed meat
    kind: food-group
    priority: 2
    safety: false
    status: proposed
    questions:
      - How do legumes, nuts and seeds, fish, poultry, eggs, red meat and processed meat compare in their links to cardiovascular disease and diabetes?
      - How much red and processed meat, fish and eggs do the opened guidelines suggest per week, and for whom do limits differ (for example, eggs with high LDL-C)?
      - Does dietary cholesterol (for example from eggs) raise LDL-C enough to matter for this cohort?
      - Does replacing animal with plant protein change A1C, LDL-C or blood pressure?
      - Which kinds of fish and preparation methods matter (for example, fried fish)?
    rationale: >-
      Guidelines rank protein foods: ESC/EAS food-choice table and dietary cholesterol (D22), EASD minimizing red and
      processed meat with fatty fish (D30), AHA legumes, nuts, at least two fish meals and lean unprocessed meat (D81), ADA
      plant protein (D13), Canada plant proteins more often (D37), Heart Foundation red meat 1-3 times a week and eggs up
      to 7 a week for people with high LDL-C or type 2 diabetes (D96); the US federal guidelines' emphasis on animal protein
      is disputed (D34, D35).
    discovered_via: [D13, D22, D30, D34, D35, D37, D81, D96]
    depends_on: [pattern-overall-eating-pattern, nutrient-dietary-fats]
    watch: true
  - id: foodgroup-dairy
    title: Milk, yogurt and cheese - full-fat or reduced-fat
    kind: food-group
    priority: 2
    safety: false
    status: proposed
    questions:
      - Do full-fat and reduced-fat dairy differ in their effects on LDL-C, blood pressure, weight and diabetes risk?
      - Do cheese, yogurt and milk differ from each other and from butter?
      - Which guidelines recommend reduced-fat dairy, for which people, and which accept full-fat?
      - How many servings of dairy, if any, do guidelines suggest for this cohort?
    rationale: >-
      Advice differs: AHA favors low-fat or fat-free dairy (D81); ESC/EAS ranks skimmed milk and yogurt as preferred and
      regular cheese as occasional (D22); the Heart Foundation recommends reduced-fat for people with heart disease or high
      cholesterol but allows either for others (D96); ADA's BP section counts low-fat dairy servings (D14); the 2025-2030
      US federal guidelines recommend three servings of full-fat dairy (D34), which the ACC group questions (D35).
    discovered_via: [D14, D22, D34, D35, D81, D96]
    depends_on: [nutrient-dietary-fats]
    watch: true
  - id: food-ultra-processed
    title: Ultra-processed and highly processed foods
    kind: food
    priority: 2
    safety: false
    status: proposed
    questions:
      - How do authorities define ultra-processed or highly processed food, and why is the definition disputed?
      - How strong is the evidence linking these foods to diabetes, cardiovascular death, hypertension and weight, and is any of it causal?
      - Is the risk explained by sodium, sugar and saturated fat content, or is processing itself implicated?
      - Which processed foods (for example canned vegetables, wholemeal bread) fit a healthy pattern?
    rationale: >-
      Many opened guidelines now name processed food: ADA minimizes processed and ultra-processed foods (D13), KDIGO limits
      ultra-processed foods (D28), MASLD guidance limits them (D83), Canada and the US federal guidelines target highly
      processed foods (D32, D37), AHA notes the lack of an agreed definition (D81), the Heart Foundation says not all
      processed foods need avoiding (D96). A 2024 umbrella review finds associations of mostly low certainty (D98).
    discovered_via: [D13, D28, D32, D37, D81, D83, D96, D98]
    depends_on: [pattern-overall-eating-pattern, nutrient-sodium]
    watch: true
  # ---------------- Beverages ----------------
  - id: beverage-alcohol
    title: Alcohol - effects on blood pressure, triglycerides, glucose and medicines
    kind: beverage
    priority: 1
    safety: true
    status: proposed
    questions:
      - How do drinking amounts relate to blood pressure, triglycerides, weight and cardiovascular events, and is there any level without added risk?
      - What drink limits do US, European, Canadian and Australian sources now give, and how have they changed?
      - Which medicines common in this cohort carry alcohol warnings on their labels (for example metformin, statins, thiazides), and what do the warnings say?
      - Is alcohol advice stricter for people whose triglycerides are raised?
      - What should people who do not drink be told?
    rationale: >-
      Alcohol advice is shifting: ESC sets under about 100 g a week with not drinking preferred (D9), ADA keeps daily
      limits but says no amount is known to be safe (D13, D14), ESC/EAS rates alcohol reduction as the largest triglyceride
      lever (D22), Canada's 2023 guidance uses a weekly risk continuum (D93), AHA advises non-drinkers not to start (D81),
      the Heart Foundation does not recommend alcohol for heart health (D96), MASLD guidance discourages it (D83). Labels
      warn about alcohol with metformin (lactic acidosis), statins (liver) and thiazides (low BP on standing) (D42, D54, D56).
    discovered_via: [D9, D13, D14, D22, D42, D54, D56, D81, D83, D93, D96]
    depends_on: [targets-clinical-goals]
    watch: true
  - id: beverage-coffee-tea-water
    title: Water, coffee, tea and energy drinks
    kind: beverage
    priority: 3
    safety: false
    status: proposed
    questions:
      - Does coffee raise blood pressure or hypertension risk in regular drinkers, and does it affect glucose or lipids?
      - What does the evidence say about tea and blood pressure?
      - Why do guidelines name water as the default drink, and how much fluid do people need (including those with kidney stones or on SGLT2 inhibitors)?
      - Do energy drinks pose particular risks for people with high blood pressure?
    rationale: >-
      ESC reviews coffee, tea and energy drinks for blood pressure (D9); ADA and Canada name water as the preferred drink
      (D13, D37); the Heart Foundation lists tea and coffee among acceptable drinks (D96); MASLD guidance notes coffee's
      association with better liver outcomes (D83); a stone guideline sets fluid targets (D88).
    discovered_via: [D9, D13, D37, D83, D88, D96]
    depends_on: [nutrient-sugars-sweetened-drinks]
    watch: false
  # ---------------- Supplements ----------------
  - id: supplement-cholesterol-lowering
    title: Plant sterols, red yeast rice, fish oil and other cholesterol supplements
    kind: supplement
    priority: 1
    safety: true
    status: proposed
    questions:
      - How much do plant sterol or stanol foods lower LDL-C, and is there any outcome evidence?
      - What is red yeast rice, why has the EU restricted it, and what risks arise when it is combined with a statin?
      - How do over-the-counter omega-3 supplements differ from prescription icosapent ethyl in evidence and use?
      - What do guidelines say about soy, berberine, policosanol and other nutraceuticals for cholesterol?
      - Did the 2025 ESC/EAS focused update change the 2019 position on supplements, and how?
    rationale: >-
      ESC/EAS 2019 grades plant sterols, red yeast rice and other nutraceuticals (D22), but its 2025 focused update reports no
      supplement as both safe and effective and notes the EU restriction on red yeast rice (D23, D24). ADA advises against
      adding n-3 supplements to statins while allowing icosapent ethyl in a defined group (D14), whose label lists fish
      allergy and bleeding cautions (D67). Statin labels warn about niacin and ask about supplements (D42, D44). Red yeast
      rice contains a statin-like compound, so this is a safety topic.
    discovered_via: [D14, D22, D23, D24, D42, D44, D67]
    depends_on: [nutrient-dietary-fats, medication-lipid-lowering-interactions]
    watch: true
  - id: supplement-vitamins-minerals
    title: Vitamin and mineral supplements the cohort may be offered or need
    kind: supplement
    priority: 2
    safety: false
    status: proposed
    questions:
      - Do any vitamin, mineral or herbal supplements improve blood pressure, glucose or lipids, according to the guidelines?
      - When do medicines (metformin for vitamin B12, orlistat for fat-soluble vitamins) create a need for testing or supplements?
      - Which supplements carry specific risks for this cohort (for example beta-carotene, high-dose vitamin C with kidney stones)?
      - Is a multivitamin advisable during substantial weight loss, and what do guidelines say?
    rationale: >-
      ADA recommends against supplements for glycemic benefit and against beta-carotene, and suggests B12 testing with
      metformin (D13); the metformin label reports B12 falls (D56); the orlistat label requires a multivitamin (D65); MASLD
      guidance rejects nutraceuticals (D83); gout guidance finds vitamin C supplements ineffective (D85); a stone guideline
      caps vitamin C supplements (D88).
    discovered_via: [D13, D56, D65, D83, D85, D88]
    depends_on: [medication-glucose-lowering-interactions, medication-incretin-weight-drugs-nutrition]
    watch: false
  # ---------------- Medication interactions ----------------
  - id: medication-lipid-lowering-interactions
    title: Food, drink and supplement interactions with cholesterol and triglyceride medicines
    kind: medication-interaction
    priority: 1
    safety: true
    status: proposed
    questions:
      - Which statins have grapefruit warnings on their labels, and how do the warnings differ (avoid versus large amounts)?
      - What do labels say about alcohol, niacin and other supplements with statins?
      - What food timing rules apply to ezetimibe, bempedoic acid, fenofibrate and icosapent ethyl?
      - Which label effects of these medicines have dietary relevance (for example raised uric acid with bempedoic acid, gallstones with fenofibrate)?
      - Which other drugs commonly taken in this cohort limit statin doses in ways a person should know about?
    rationale: >-
      Statins are first-line in every lipid source (D14, D18). Labels differ on grapefruit: avoid with simvastatin, avoid
      more than 1.2 L a day with atorvastatin (D42, D44); amlodipine caps simvastatin dose (D52). Labels give food timing
      and effects for ezetimibe, bempedoic acid (uric acid, gout), fenofibrate (gallstones; diet before starting) and icosapent
      ethyl (with food) (D67, D69, D73, D77). Scope boundary: triglycerides ≥500 mg/dL are excluded (SCOPE §5).
    discovered_via: [D14, D18, D42, D44, D52, D67, D69, D73, D77]
    depends_on: []
    watch: false
  - id: medication-blood-pressure-interactions
    title: Food, salt-substitute and alcohol interactions with blood pressure medicines
    kind: medication-interaction
    priority: 1
    safety: true
    status: proposed
    questions:
      - What do ACE inhibitor, ARB, spironolactone and finerenone labels say about potassium supplements, salt substitutes and potassium-rich diets?
      - Which blood pressure medicines have grapefruit warnings, and which do not?
      - How do thiazide diuretics affect potassium, magnesium, glucose, uric acid and lipids, and what dietary implications follow?
      - What do labels say about dehydration, heavy sweating, vomiting or diarrhea with these medicines?
      - Do any blood pressure medicines need to be taken with or without food?
    rationale: >-
      First-line BP classes are named by ESC and ADA (D9, D14). Labels for lisinopril, losartan, spironolactone and
      finerenone warn about potassium supplements and salt substitutes, and spironolactone about potassium-rich diets and
      consistent dosing with food (D46, D48, D50, D71); finerenone requires avoiding grapefruit, amlodipine has no
      grapefruit effect (D52, D71); hydrochlorothiazide affects potassium, magnesium, glucose, uric acid and lipids (D54);
      KDIGO asks for potassium checks after starting RAS blockers (D28). Scope boundary: heart failure is excluded (SCOPE §5)
      though some of these labels address it.
    discovered_via: [D9, D14, D28, D46, D48, D50, D52, D54, D71]
    depends_on: [nutrient-potassium-salt-substitutes]
    watch: false
  - id: medication-glucose-lowering-interactions
    title: Food, alcohol and fasting interactions with glucose-lowering medicines
    kind: medication-interaction
    priority: 1
    safety: true
    status: proposed
    questions:
      - What do metformin labels say about taking it with meals, alcohol, and vitamin B12?
      - What do SGLT2 inhibitor labels say about ketoacidosis triggers (low-calorie or ketogenic eating, fasting, alcohol), hydration and urine glucose tests?
      - How must oral semaglutide be taken relative to food, water and other medicines?
      - What dietary implications follow from pioglitazone's fluid retention and weight effects and from DPP-4 inhibitor labels?
      - When does a person on these medicines need to discuss planned fasting or a major diet change with their prescriber?
    rationale: >-
      ADA lists the classes and diet cautions (D13). Labels: metformin with meals, alcohol and B12 (D56); empagliflozin
      ketoacidosis triggers and volume depletion (D63); oral semaglutide on an empty stomach with limited water (D59);
      pioglitazone fluid retention and weight gain (D75); sitagliptin with or without food and pancreatitis questions (D79).
      Scope boundary: insulin, sulfonylureas and meglitinides are excluded (SCOPE §5) because of hypoglycemia risk.
    discovered_via: [D13, D56, D59, D63, D75, D79]
    depends_on: [pattern-carbohydrate-reduction, beverage-alcohol]
    watch: false
  - id: medication-incretin-weight-drugs-nutrition
    title: Eating well on GLP-1-based and other weight-loss medicines
    kind: medication-interaction
    priority: 1
    safety: true
    status: proposed
    questions:
      - What gastrointestinal effects, dehydration and kidney risks do semaglutide and tirzepatide labels describe, and what eating and drinking advice follows?
      - What nutrition priorities (protein, micronutrients, muscle and bone preservation) do professional advisories set for people on these medicines?
      - What do labels say about gallbladder disease and delayed stomach emptying, including before procedures?
      - What does the orlistat label require about dietary fat and vitamin supplements?
      - What happens to weight and diet needs when these medicines are stopped?
    rationale: >-
      GLP-1 medicines now appear in BP guidance for people with overweight (D3) and ESC discusses semaglutide and orlistat
      (D9). Labels describe GI effects, dehydration-related kidney injury, gallbladder disease and delayed gastric emptying
      (D58, D61), weight regain after withdrawal (D61), and orlistat's fat and vitamin rules (D65). A 2025 joint advisory sets
      nutrition priorities (D92). Fast-moving: labels were revised in 2025-2026.
    discovered_via: [D3, D9, D58, D61, D65, D92]
    depends_on: [weight-loss-and-maintenance, nutrient-protein-amount]
    watch: true
  # ---------------- Behavior and situations ----------------
  - id: behavior-meal-timing-fasting
    title: Meal timing, intermittent fasting and religious fasts
    kind: behavior
    priority: 2
    safety: false
    status: proposed
    questions:
      - Do intermittent fasting or time-restricted eating improve weight, glucose, blood pressure or lipids more than ordinary calorie reduction?
      - Is there evidence that the timing of meals (chrononutrition) matters for this cohort?
      - Which commonly used medicines need extra care during prolonged or religious fasting, and what do guidelines advise?
      - Does eating consistent amounts at regular times matter for people not using insulin?
    rationale: >-
      ADA reviews intermittent fasting and time-restricted eating, finds meal-timing evidence inconclusive, and gives
      religious-fasting recommendations (D13); the empagliflozin label lists fasting as a ketoacidosis trigger and advises
      stopping before prolonged fasting for procedures (D63); oral semaglutide has fixed fasting rules (D59); NICE advises
      against restrictive, unbalanced diets (D26).
    discovered_via: [D13, D26, D59, D63]
    depends_on: [weight-loss-and-maintenance, medication-glucose-lowering-interactions]
    watch: true
  - id: situation-eating-out
    title: Eating out, takeaway and social occasions
    kind: situation
    priority: 3
    safety: false
    status: proposed
    questions:
      - How do restaurant and takeaway meals differ in calories, sodium, sugar and saturated fat from home-cooked meals?
      - Which menu choices and requests do authorities suggest for people managing blood pressure, glucose and lipids?
      - How should alcohol and portion sizes be handled at social occasions?
    rationale: >-
      Canada notes restaurant meals are higher in calories, sodium, sugars and saturated fat (D37); AHA advises applying its
      guidance wherever food is prepared and notes much US sodium comes from food prepared away from home (D81); the Heart
      Foundation addresses takeaway (D96); the US federal guidelines ask people to replace highly processed foods when
      dining out (D34). No opened source gave detailed eating-out guidance, so research should look for patient-education material.
    discovered_via: [D34, D37, D81, D96]
    depends_on: [nutrient-sodium, food-ultra-processed]
    watch: false
  - id: situation-shopping-cooking-labels
    title: Shopping, food labels and cooking methods
    kind: situation
    priority: 3
    safety: false
    status: proposed
    questions:
      - Which parts of a nutrition label matter most for sodium, sugar, saturated fat and fiber, and how should they be read?
      - Which cooking methods do guidelines favor or advise limiting, and why?
      - Are frozen, canned and dried foods acceptable substitutes for fresh, and what should people check on their labels?
      - What practical plate or portion models do authorities use?
    rationale: >-
      Canada promotes cooking skills and label reading and accepts frozen, canned and dried foods (D37); ESC/EAS and NICE
      grade cooking methods (D22, D100); the Heart Foundation gives a plate model and label tools (D96).
    discovered_via: [D22, D37, D96, D100]
    depends_on: [nutrient-sodium, food-ultra-processed]
    watch: false
  # ---------------- Adjacent conditions ----------------
  - id: condition-kidney-function-diet
    title: Diet when kidney function is mildly reduced or albumin is in the urine
    kind: other
    priority: 1
    safety: true
    status: proposed
    questions:
      - Which dietary rules (protein, sodium, potassium, phosphorus) change at eGFR 45-59 or with urine albumin 30-300 mg/g, according to kidney guidelines?
      - How should people in this range balance potassium-rich eating patterns with medicines that raise potassium?
      - What do kidney guidelines say about plant-based eating and ultra-processed foods?
      - When should a person be referred to a kidney dietitian?
    rationale: >-
      SCOPE asks personal guides to find out kidney status (SCOPE §3) and flags eGFR 45-59 and UACR 30-300 (SCOPE §4).
      KDIGO sets protein, sodium and potassium advice by CKD stage and favors plant-based foods (D28); ESC limits potassium
      advice in moderate-to-advanced CKD (D9); EASD lowers protein with nephropathy (D30); finerenone and RAS-blocker labels
      add potassium cautions (D46, D71). Safety-critical because of hyperkalemia. Scope boundary: eGFR below 45 is excluded.
    discovered_via: [D9, D28, D30, D46, D71]
    depends_on: [nutrient-protein-amount, nutrient-potassium-salt-substitutes]
    watch: false
  - id: condition-fatty-liver-diet
    title: Diet with fatty liver disease (MASLD) alongside the cardiometabolic cluster
    kind: other
    priority: 2
    safety: false
    status: proposed
    questions:
      - How much weight loss improves liver fat, inflammation and fibrosis, and how do these targets compare with cardiometabolic ones?
      - Which dietary pattern and specific limits (sugary drinks, ultra-processed foods, alcohol) do liver guidelines recommend?
      - What is the evidence on coffee and liver outcomes?
      - Which commonly used medicines are considered safe in fatty liver disease, and does that change diet advice?
    rationale: >-
      Fatty liver is a SCOPE §4 flag. The 2024 EASL-EASD-EASO guideline sets weight targets, a Mediterranean-like pattern,
      limits on ultra-processed foods and sugary drinks, alcohol advice and a coffee statement (D83); ADA's pattern advice
      overlaps (D13); pioglitazone's label is relevant because the drug is discussed for MASH (D75). Scope boundary:
      cirrhosis is excluded (SCOPE §5).
    discovered_via: [D13, D75, D83]
    depends_on: [weight-loss-and-maintenance, beverage-alcohol]
    watch: false
  - id: condition-gout-kidney-stones-diet
    title: Diet with gout or kidney stones alongside the cardiometabolic cluster
    kind: other
    priority: 3
    safety: false
    status: proposed
    questions:
      - What do gout guidelines say about alcohol, purine-rich foods, fructose-sweetened drinks, vitamin C and weight loss, and how strong is the evidence?
      - What fluid, sodium, calcium, oxalate and animal-protein advice applies to people with kidney stones?
      - Which cardiometabolic medicines raise uric acid or affect stone risk (for example thiazides, bempedoic acid, orlistat), and what do labels say?
      - Where does advice for these conditions conflict with the core cohort's eating pattern?
    rationale: >-
      Gout and kidney stones are SCOPE §4 flags. The 2020 ACR gout guideline (read via summary) finds limited evidence for
      diet restriction and suggests losartan over hydrochlorothiazide (D84, D85); a provincial stone nutrition guideline gives
      fluid, sodium, calcium and oxalate advice (D88), while the 2026 AUA stone guideline could not be used (D87). Labels:
      thiazides raise uric acid (D54), bempedoic acid raises uric acid and gout (D73), orlistat raises urinary oxalate (D65).
    discovered_via: [D54, D65, D73, D84, D85, D87, D88]
    depends_on: [beverage-alcohol, nutrient-sugars-sweetened-drinks]
    watch: false
