gaps:
  - "US 2025 ACC/AHA high blood pressure guideline: full text could not be opened (publisher refused; not open access); known through abstract and AHA/ACC summaries."
  - "US 2026 ACC/AHA dyslipidemia guideline: full text not opened; its dietary recommendations, triglyceride categories and non-HDL-C goals are unknown to this run."
  - "2025 ESC/EAS dyslipidaemia focused update: recommendation text not read (repository PDF restricted)."
  - "Dietary Guidelines for Americans 2025-2030: official PDF could not be opened; known through ODPHP page, AAFP summary and ACC commentary."
  - "WHO 2025 salt-substitute guideline and WHO 2023 non-sugar sweetener guideline: read only through WHO pages and an overview; WHO sodium, potassium, sugars, saturated/trans fat and carbohydrate guidelines not opened."
  - "Canada: no condition-specific guideline opened (Hypertension Canada, Diabetes Canada nutrition chapter, Canadian Cardiovascular Society lipids) - only Canada's Dietary Guidelines and alcohol guidance."
  - "UK: NICE hypertension (NG136), type 2 diabetes (NG28) and lipid modification (NG238) guidelines not opened; UK covered only for weight and diabetes prevention."
  - "Australia-New Zealand: no clinical guideline opened (Heart Foundation public page only; Australian Dietary Guidelines and hypertension guideline not opened)."
  - "No Asian, Latin American or African guideline opened, despite SCOPE naming lower BMI thresholds for people of Asian ancestry."
  - "Drug labels: no PCSK9 inhibitor or beta-blocker label opened; hydrochlorothiazide label is a repackager copy (RLD not identified); Glucophage brand discontinued (2018 label); Xenical (2012), Vascepa (2019) and Norvasc (2019) labels may have newer versions not surfaced; Mounjaro and Wegovy labels not opened; non-US labels (EMA, Health Canada) not opened."
  - "Kidney stones: 2026 AUA guideline unusable (login and AI-use restriction); Canadian Urological Association 2022 guideline not opened."
  - "Gout: 2020 ACR guideline read only via summary; EULAR gout guidance not opened."
  - "ADA Standards §8 (obesity) and §9 (pharmacologic) not read (PMC served reCAPTCHA pages); ADA §11 (CKD) not opened."
  - "Patient-education material on eating out, special occasions and holidays was thin; no source gave detailed restaurant guidance."
  - "SCOPE thresholds left unverified: non-HDL-C ≥130 mg/dL, LDL-C 100 mg/dL lower bound, A1C ~9.0% boundary (see scope-check.yaml)."
