    named_in: [ada-standards-positive-health-behaviors-2026]
    note: Handled through the personal profile per SCOPE §4; only religious fasting (a safety point with medicines) needs research coverage. Fish/shellfish allergy appears as a caution on the icosapent ethyl label (medication-lipid-lowering-interactions).
