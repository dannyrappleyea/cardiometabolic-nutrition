adjacent_flags:
  - item: Age 30–39 or 76–79
    topics: [targets-clinical-goals]
    note: Age changes goals and risk tools (PREVENT 30-79, SCORE2-OP); each topic's adjacent-cohort section carries age cautions (for example protein for older adults).
  - item: BMI ≥40
    topics: [weight-loss-and-maintenance, medication-incretin-weight-drugs-nutrition]
    named_in: [nice-overweight-obesity-management-ng246-2025]
  - item: eGFR 45–59, or UACR 30–300 mg/g
    topics: [condition-kidney-function-diet]
    named_in: [kdigo-ckd-guideline-2024]
  - item: Type 2 diabetes with A1C 9.0% or higher
    topics: [medication-glucose-lowering-interactions, pattern-carbohydrate-reduction]
    named_in: [ada-standards-pharmacologic-glycemic-2026]
    note: >-
      No source opened defines a diet boundary at 9.0%. ADA §9 considers insulin at A1C above 10% or with symptoms
      (Rec 9.20), a drug-treatment threshold. Open question for topic research - does any guideline change dietary
      advice for people with A1C of 9.0% or more who are not using insulin or secretagogues? The exclusion itself rests
      on actual medicine use (SCOPE §5), not on A1C.
  - item: LDL-C ≥190 mg/dL or suspected familial hypercholesterolemia
    topics: [targets-clinical-goals, medication-lipid-lowering-interactions]
    named_in: [esc-eas-dyslipidaemias-guideline-2019]
    note: Diet alone cannot be expected to reach goals here; topics carry the caution.
  - item: Established cardiovascular disease (secondary prevention)
    topics: [targets-clinical-goals]
    named_in: [ada-standards-cvd-risk-management-2026, esc-eas-dyslipidaemias-guideline-2019]
  - item: Resistant hypertension
    topics: [nutrient-sodium, beverage-alcohol, medication-blood-pressure-interactions, nutrient-potassium-salt-substitutes]
    named_in: [esc-elevated-bp-hypertension-guideline-2024, hypertension-canada-primary-care-guideline-2025, nice-hypertension-ng136-2026]
    note: >-
      ESC Table 11 lists excess sodium and alcohol among behavioural causes of true resistance. Hypertension Canada and
      NICE suggest spironolactone as the add-on drug (NICE only if potassium is 4.5 mmol/L or lower), so potassium
      cautions apply.
  - item: Fatty liver disease without cirrhosis (MASLD)
    topics: [condition-fatty-liver-diet]
    named_in: [easl-easd-easo-masld-guideline-2024]
  - item: Gout, or kidney stones
    topics: [condition-gout-kidney-stones-diet]
