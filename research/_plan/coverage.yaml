adjacent_flags:
  - item: Age 30–39 or 76–79
    topics: [targets-clinical-goals]
    note: Age changes goals and risk tools (PREVENT 30-79, SCORE2-OP); each topic's adjacent-cohort section carries age cautions (for example protein for older adults).
  - item: BMI ≥40
    topics: [weight-loss-and-maintenance, medication-incretin-weight-drugs-nutrition]
    named_in: [nice-overweight-obesity-management-ng246-2025]
