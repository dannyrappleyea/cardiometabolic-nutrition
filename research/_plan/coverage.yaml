  - item: Food allergies, celiac disease, or religious, cultural or ethical dietary rules
    topics: [behavior-meal-timing-fasting]
    named_in: [ada-standards-positive-health-behaviors-2026]
    note: Handled through the personal profile per SCOPE §4; the research covers religious fasting only as a medicine-safety point (fasting while taking glucose-lowering medicines). Fish/shellfish allergy appears as a caution on the icosapent ethyl label (medication-lipid-lowering-interactions).
